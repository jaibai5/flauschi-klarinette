<!DOCTYPE html>
<html lang="de">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no">
<meta name="theme-color" content="#ff4f8b">
<title>Flauschis Klarinetten-Abenteuer</title>
<!-- Gebaut aus src/ mit: node tools/build.mjs · Nicht direkt bearbeiten, sondern die Dateien in src/ ändern. -->
<style>*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
html,body{margin:0;height:100%;overflow:hidden;font-family:"Trebuchet MS","Segoe UI",Roboto,Arial,sans-serif;color:#3a2d4a;background:linear-gradient(160deg,#fff4fb 0%,#eef6ff 55%,#f1fff0 100%)}
button{font-family:inherit;cursor:pointer;touch-action:manipulation}
#app{position:fixed;inset:0;display:flex;flex-direction:column}
#hud{display:flex;align-items:center;gap:8px;padding:6px 10px;min-height:54px;background:rgba(255,255,255,.75);box-shadow:0 2px 8px rgba(90,70,104,.12);z-index:5}
#hud .sp{flex:1}
.chip{display:inline-flex;align-items:center;gap:4px;background:#fff;border:2px solid #e4d7f2;border-radius:22px;padding:4px 12px;font-weight:800;font-size:20px;white-space:nowrap}
.ib{border:0;background:#fff;border-radius:16px;font-size:24px;width:48px;height:44px;box-shadow:0 2px 0 #d9cbe8}
#tday{position:relative;overflow:hidden;min-width:150px}
#tday i{position:absolute;left:0;top:0;bottom:0;background:#c9f2c4;z-index:0;transition:width .5s}
#tday span{position:relative;z-index:1}
main{flex:1;position:relative;overflow:hidden}
.scr{position:absolute;inset:0;display:none;padding:12px 16px;overflow-y:auto}
.scr.on{display:block}
h1{margin:4px 0 8px;font-size:32px}
h2{margin:4px 0 8px;font-size:26px}
.btn{border:0;border-radius:22px;padding:14px 26px;font-size:24px;font-weight:800;color:#fff;background:#7b5cff;box-shadow:0 5px 0 #5a3cc0;margin:6px}
.btn:active{transform:translateY(3px);box-shadow:0 2px 0 #5a3cc0}
.btn.pink{background:#ff4f8b;box-shadow:0 5px 0 #c2185b}
.btn.green{background:#2fb35a;box-shadow:0 5px 0 #1d7d3c}
.btn.alt{background:#fff;color:#5a4668;box-shadow:0 5px 0 #d9cbe8;border:2px solid #e4d7f2}
.btn.huge{font-size:34px;padding:22px 40px;border-radius:30px}
.btn:disabled{opacity:.45}
.row{display:flex;flex-wrap:wrap;align-items:center;justify-content:center;gap:4px}
.card{background:#fff;border-radius:26px;padding:16px 20px;box-shadow:0 6px 18px rgba(90,70,104,.12)}
.say{background:#fff;border-radius:24px;padding:12px 18px;font-size:24px;font-weight:700;position:relative;box-shadow:0 4px 12px rgba(90,70,104,.12)}
.muted{color:#7d6d8c;font-size:18px}
/* Start */
#home .wrap{display:flex;height:100%;align-items:center;justify-content:center;gap:24px}
#hAlp{width:min(36vw,330px)}
#home .menu{display:flex;flex-direction:column;align-items:stretch;gap:6px;min-width:330px}
/* Karte */
#map .grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(150px,1fr));gap:12px}
.isl{border:0;border-radius:24px;background:#fff;padding:10px;text-align:center;box-shadow:0 5px 0 #d9cbe8;min-height:132px}
.isl b{display:block;font-size:44px}
.isl span{display:block;font-weight:800;font-size:17px}
.isl small{display:block;font-size:14px;color:#7d6d8c}
.isl.lock{background:#eee8f3;color:#9b8fa8;box-shadow:none}
.isl.cur{outline:4px solid #ffcf2e}
/* Insel */
#isl .grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(190px,1fr));gap:12px}
.stn{border:0;border-radius:22px;background:#fff;padding:12px;text-align:left;box-shadow:0 5px 0 #d9cbe8;display:flex;gap:10px;align-items:center;min-height:86px}
.stn .ic{font-size:36px}
.stn .t{font-weight:800;font-size:19px}
.stn .s{font-size:18px;letter-spacing:1px}
.stn.hw{outline:4px solid #ff4f8b}
/* Übung */
#ex{display:none;flex-direction:column;padding:8px 14px}
#ex.on{display:flex}
#exTop{display:flex;align-items:center;gap:10px}
#exTop h2{flex:1;margin:0}
#exBody{flex:1;display:flex;align-items:center;justify-content:center;gap:18px;min-height:0}
#exL{flex:1;display:flex;flex-direction:column;align-items:center;justify-content:center;min-width:0;height:100%}
#exR{width:150px;display:flex;flex-direction:column;align-items:center;gap:6px}
#exFing svg{width:120px;height:auto}
#exAlp{width:140px}
.bigname{font-size:64px;font-weight:900;line-height:1}
.staff{width:100%;max-width:980px}
.staff svg{width:100%;height:auto;display:block}
.n{fill:#3a2d4a;stroke:#3a2d4a}
.n.now{fill:#7b5cff;stroke:#7b5cff}
.n.ok{fill:#2fb35a;stroke:#2fb35a}
.n.bad{fill:#ff4f8b;stroke:#ff4f8b}
.n .hol{fill:#fff}
.meter{width:min(560px,90%);height:34px;border-radius:18px;background:#f0e8f8;overflow:hidden;border:3px solid #e4d7f2;margin:8px}
.meter i{display:block;height:100%;width:0;background:linear-gradient(90deg,#8ee08a,#2fb35a);transition:width .12s}
.tuner{position:relative;width:min(560px,90%);height:56px;margin:4px}
.tuner .sc{position:absolute;left:0;right:0;top:24px;height:8px;border-radius:4px;background:linear-gradient(90deg,#ffb3c7,#fff1a8 35%,#8ee08a 45%,#8ee08a 55%,#fff1a8 65%,#ffb3c7)}
.tuner .nd{position:absolute;top:6px;width:8px;height:44px;margin-left:-4px;border-radius:4px;background:#3a2d4a;left:50%;transition:left .1s}
.tuner .lb{position:absolute;top:-2px;font-weight:800;font-size:16px}
.hint{font-size:26px;font-weight:800;min-height:36px;text-align:center}
.dots{display:flex;gap:10px;justify-content:center;margin:6px}
.dots i{width:30px;height:30px;border-radius:50%;background:#efe6f7;border:3px solid #e4d7f2}
.dots i.ok{background:#2fb35a;border-color:#1d7d3c}
.dots i.bad{background:#ff4f8b;border-color:#c2185b}
.dots i.now{border-color:#7b5cff;background:#d8ccff}
.ring{width:190px;height:190px;border-radius:50%;display:flex;align-items:center;justify-content:center;font-size:30px;font-weight:900;background:#e9f6ff;border:8px solid #7cc8ff;transition:transform 1s linear}
.ov{position:absolute;inset:0;background:rgba(255,246,252,.94);display:none;align-items:center;justify-content:center;z-index:8;flex-direction:column;text-align:center;padding:16px}
.ov.on{display:flex}
.stars{font-size:72px;letter-spacing:6px}
.stars .off{filter:grayscale(1);opacity:.3}
.opts{display:grid;grid-template-columns:1fr 1fr;gap:12px;width:min(640px,95%)}
.opt{border:0;border-radius:22px;background:#fff;font-size:30px;font-weight:900;padding:18px;box-shadow:0 5px 0 #d9cbe8;color:#3a2d4a}
.opt.good{background:#c9f2c4}
.opt.no{background:#ffd1df}
.cnt{font-size:120px;font-weight:900;color:#7b5cff}
/* Laden */
#shop .grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(150px,1fr));gap:10px}
.item{border:0;border-radius:20px;background:#fff;padding:8px;box-shadow:0 4px 0 #d9cbe8;text-align:center;font-weight:800}
.item b{display:block;font-size:40px}
.item.own{background:#f0fff0}
.item.wear{outline:4px solid #2fb35a}
.item.lock{opacity:.45}
.item small{display:block;font-weight:600;font-size:13px;color:#7d6d8c}
#shop .top{display:flex;gap:16px;align-items:center}
#sAlp{width:170px;flex:none}
/* Spiel */
#run{padding:0}
#runF{position:absolute;inset:0;overflow:hidden;touch-action:none}
#runG{position:absolute;left:0;right:0;bottom:0;height:56px}
#runA{position:absolute;left:50px;bottom:56px;width:100px;z-index:3}
#runA.inv{opacity:.5}
.ob{position:absolute;left:0;font-size:40px;line-height:1;z-index:2}
#runH{position:absolute;left:10px;top:10px;display:flex;gap:6px;z-index:4}
#runM{position:absolute;inset:0;display:flex;align-items:center;justify-content:center;z-index:6;background:rgba(255,255,255,.55)}
.lvl{display:grid;grid-template-columns:repeat(5,64px);gap:8px;justify-content:center;margin:8px}
.lvl button{height:60px;border:0;border-radius:16px;font-size:20px;font-weight:900;background:#fff;box-shadow:0 4px 0 #d9cbe8}
.lvl button.done{background:#c9f2c4}
.lvl button:disabled{opacity:.35}
/* Eltern */
#par table{border-collapse:collapse;width:100%;font-size:17px}
#par td,#par th{border-bottom:1px solid #eee3f5;padding:6px;text-align:left}
.bars{display:flex;gap:8px;align-items:flex-end;height:150px;padding:6px;border-bottom:3px solid #e4d7f2;position:relative}
.bars div{flex:1;background:#7cc8ff;border-radius:8px 8px 0 0;position:relative;min-height:2px}
.bars div.hit{background:#2fb35a}
.bars div span{position:absolute;bottom:-24px;left:0;right:0;text-align:center;font-size:13px}
.bars div em{position:absolute;top:-20px;left:0;right:0;text-align:center;font-size:13px;font-style:normal;font-weight:800}
.goal{position:absolute;left:0;right:0;border-top:2px dashed #ff4f8b}
#par select,#par input,#par textarea{font-size:18px;padding:6px;border-radius:10px;border:2px solid #e4d7f2;font-family:inherit}
.cols{display:grid;grid-template-columns:1fr 1fr;gap:14px}
/* Flauschi-Animation */
.salto{animation:salto .9s ease}
@keyframes salto{0%{transform:translateY(0) rotate(0)}40%{transform:translateY(-70px) rotate(-180deg)}80%{transform:translateY(-10px) rotate(-360deg)}100%{transform:translateY(0) rotate(-360deg)}}
.hop{animation:hop .5s ease}
@keyframes hop{50%{transform:translateY(-22px)}}
.tw{animation:tw 1.4s infinite}.tw.b{animation-delay:.4s}.tw.c{animation-delay:.8s}
@keyframes tw{50%{opacity:.2}}
#toast{position:fixed;left:50%;top:70px;transform:translateX(-50%);background:#3a2d4a;color:#fff;font-weight:800;font-size:22px;padding:10px 20px;border-radius:20px;display:none;z-index:20}
.conf{position:fixed;top:-40px;font-size:34px;animation:fall 2.6s linear forwards;z-index:30;pointer-events:none}
@keyframes fall{to{transform:translateY(110vh) rotate(540deg)}}
@media (orientation:portrait){#home .wrap{flex-direction:column}#hAlp{width:44vw}#exBody{flex-direction:column}#exR{flex-direction:row;width:auto}.cols{grid-template-columns:1fr}}
@media (max-height:620px){h1{font-size:26px}.bigname{font-size:48px}.btn.huge{font-size:28px;padding:16px 30px}.cnt{font-size:90px}#exFing svg{width:96px}#exAlp{width:110px}}
</style>
</head>
<body>
<div id="app">
  <div id="hud">
    <button class="ib" id="bHome" data-act="home" aria-label="Start">🏠</button>
    <span class="chip" id="hStar">⭐ 0</span><span class="chip" id="hTix">🎟️ 0</span><span class="chip" id="hFire">🔥 0</span>
    <span class="sp"></span>
    <span class="chip" id="tday"></span>
    <button class="ib" id="bSnd" data-act="snd" aria-label="Ton">🔊</button>
  </div>
  <main>
    <section class="scr" id="home"><div class="wrap">
      <div id="hAlp"></div>
      <div class="menu">
        <div class="say" id="hSay"></div>
        <button class="btn pink huge" data-act="today">▶ Heute üben</button>
        <div class="row" style="justify-content:stretch">
          <button class="btn" style="flex:1" data-act="map">🗺️ Inseln</button>
          <button class="btn" style="flex:1" data-act="shop">🛍️ Laden</button>
        </div>
        <div class="row" style="justify-content:stretch">
          <button class="btn green" style="flex:1" data-act="run">🎮 Hüpfspiel</button>
          <button class="btn alt" style="flex:1" data-act="tuner">🎚️ Ton-Lupe</button>
        </div>
        <button class="btn alt" data-act="par" style="font-size:18px;padding:8px">👪 Eltern</button>
      </div>
    </div></section>

    <section class="scr" id="map"><h1>🗺️ Flauschis Inseln</h1><div class="grid" id="mapG"></div></section>

    <section class="scr" id="isl"><div class="row" style="justify-content:space-between"><h1 id="islH"></h1><button class="btn alt" data-act="map">🗺️ Karte</button></div><div class="grid" id="islG"></div></section>

    <section class="scr" id="ex">
      <div id="exTop"><h2 id="exT"></h2><button class="btn alt" data-act="back" style="font-size:18px;padding:8px 16px">✕ Aufhören</button></div>
      <div id="exBody"><div id="exL"></div><div id="exR"><div id="exFing"></div><div id="exAlp"></div></div></div>
      <div class="ov" id="exGo"></div>
      <div class="ov" id="exRes"></div>
    </section>

    <section class="scr" id="shop">
      <div class="top"><div id="sAlp"></div><div><h1>🛍️ Flauschis Laden</h1><p class="say" id="shopMsg"></p></div></div>
      <h2>Kleidung</h2><div class="grid" id="shopG"></div>
      <h2>🎮 Spiel-Ausrüstung</h2><div class="grid" id="shopG2"></div>
    </section>

    <section class="scr" id="run"><div id="runF"><div id="runG"></div><div id="runA"></div><div id="runH"></div><div id="runM"></div></div></section>

    <section class="scr" id="tun"><h1>🎚️ Ton-Lupe</h1><div id="tunB" style="display:flex;flex-direction:column;align-items:center"></div><p class="muted" style="text-align:center">Zeigt den gespielten Ton (notiert für B-Klarinette) und ob er zu hoch oder zu tief ist.</p></section>

    <section class="scr" id="par"><div id="parB"></div></section>
  </main>
</div>
<div id="toast"></div>
<script id="logic">/* Flauschis Klarinetten-Abenteuer · Logik ohne DOM (wird in die HTML-Datei eingebettet und von tests/ geprüft).
   Alle Notennamen sind NOTIERT (B-Klarinette). Klingend = notiert − 2 Halbtöne. */
(function (root) {
  'use strict';

  /* ---------- Töne und Oehler-Griffe (Grifftabelle des Hefts, Buchseite 72; als Tatsachen übernommen) ---------- */
  // Tasten: D Daumenloch, Ü Überblasklappe, A A-Klappe, L1-L3 / R1-R3 Finger, S b-Seitenklappe rechts, F f-Seitenklappe
  var NOTES = {
    'g':    { midi: 55, keys: ['D', 'L1', 'L2', 'L3', 'R1', 'R2', 'R3'] },
    'a':    { midi: 57, keys: ['D', 'L1', 'L2', 'L3', 'R1', 'R2'] },
    'b':    { midi: 58, keys: ['D', 'L1', 'L2', 'L3', 'R1', 'S'] },
    'h':    { midi: 59, keys: ['D', 'L1', 'L2', 'L3', 'R1'] },
    "c'":   { midi: 60, keys: ['D', 'L1', 'L2', 'L3'] },
    "d'":   { midi: 62, keys: ['D', 'L1', 'L2'] },
    "e'":   { midi: 64, keys: ['D', 'L1'] },
    "f'":   { midi: 65, keys: ['D', 'L1', 'F'] },
    "fis'": { midi: 66, keys: ['D'] },
    "g'":   { midi: 67, keys: [] },
    "a'":   { midi: 69, keys: ['A'] },
    "b'":   { midi: 70, keys: ['A', 'Ü'] },
    "d''":  { midi: 74, keys: ['Ü', 'D', 'L1', 'L2', 'L3', 'R1', 'R2', 'R3'] },
    "e''":  { midi: 76, keys: ['Ü', 'D', 'L1', 'L2', 'L3', 'R1', 'R2'] }
  };
  var KEYWORD = { D: 'Daumenloch', 'Ü': 'Überblasklappe (Daumen)', A: 'A-Klappe (Zeigefinger links)', L1: 'Zeigefinger links', L2: 'Mittelfinger links', L3: 'Ringfinger links', R1: 'Zeigefinger rechts', R2: 'Mittelfinger rechts', R3: 'Ringfinger rechts', S: 'b-Klappe rechts', F: 'f-Klappe an der Seite' };
  var CHROMA = ['c', 'cis', 'd', 'es', 'e', 'f', 'fis', 'g', 'gis', 'a', 'b', 'h'];
  var TRANSPOSE = 2; // notiert = klingend + 2

  function marks(oct) { return oct <= 3 ? '' : (oct === 4 ? "'" : "''"); }
  function nameOfMidi(m) { var oct = Math.floor(m / 12) - 1; return CHROMA[((m % 12) + 12) % 12] + marks(oct); }
  function fingerText(name) {
    var k = NOTES[name].keys; if (!k.length) return 'Alles offen – kein Finger drückt!';
    return k.map(function (x) { return KEYWORD[x]; }).join(', ');
  }
  // Position im Notensystem: 0 = unterste Linie (e'), 1 = erster Zwischenraum (f') …
  function staffStep(name) {
    var m = /^(fis|[a-h])('*)$/.exec(name); if (!m) return 0;
    var li = { c: 0, d: 1, e: 2, f: 3, fis: 3, g: 4, a: 5, h: 6, b: 6 }[m[1]];
    var oct = 3 + m[2].length;
    return oct * 7 + li - (4 * 7 + 2);
  }
  function accidental(name) { return /^b/.test(name) ? 'flat' : (/^fis/.test(name) ? 'sharp' : ''); }
  function concertFreq(name, a4) { return (a4 || 440) * Math.pow(2, (NOTES[name].midi - TRANSPOSE - 69) / 12); }
  function analyzeFreq(f, a4) {
    var m = 69 + 12 * Math.log(f / (a4 || 440)) / Math.LN2 + TRANSPOSE, n = Math.round(m);
    return { midi: n, cents: (m - n) * 100, name: nameOfMidi(n) };
  }

  /* ---------- Tonhöhenerkennung (YIN, de Cheveigné & Kawahara 2002) ---------- */
  function yin(buf, sr, fmin, fmax) {
    fmin = fmin || 150; fmax = fmax || 900;
    var x = buf, rate = sr;
    if (sr > 30000) { // auf halbe Abtastrate verkleinern: 4x schneller, für 150-900 Hz genau genug
      x = new Float32Array(buf.length >> 1);
      for (var j = 0; j < x.length; j++) x[j] = (buf[2 * j] + buf[2 * j + 1]) * 0.5;
      rate = sr / 2;
    }
    var W = x.length >> 1, tMin = Math.max(2, Math.floor(rate / fmax)), tMax = Math.min(W - 2, Math.ceil(rate / fmin));
    var d = new Float32Array(tMax + 2), tau, i, s, v;
    for (tau = 1; tau <= tMax + 1; tau++) { s = 0; for (i = 0; i < W; i++) { v = x[i] - x[i + tau]; s += v * v; } d[tau] = s; }
    var run = 0; d[0] = 1;
    for (tau = 1; tau <= tMax + 1; tau++) { run += d[tau]; d[tau] = run > 0 ? d[tau] * tau / run : 1; }
    var best = -1;
    for (tau = tMin; tau <= tMax; tau++) {
      if (d[tau] < 0.15) { while (tau + 1 <= tMax && d[tau + 1] < d[tau]) tau++; best = tau; break; }
    }
    if (best < 0) {
      var mi = tMin; for (tau = tMin; tau <= tMax; tau++) if (d[tau] < d[mi]) mi = tau;
      if (d[mi] < 0.3) best = mi; else return null;
    }
    var x0 = d[best - 1], x1 = d[best], x2 = d[best + 1], den = x0 + x2 - 2 * x1, t = best;
    if (den !== 0) t = best + (x0 - x2) / (2 * den);
    return { f: rate / t, clarity: 1 - x1 };
  }
  function rms(buf) { var s = 0; for (var i = 0; i < buf.length; i++) s += buf[i] * buf[i]; return Math.sqrt(s / buf.length); }

  /* ---------- Melodien: "e'4 d'4 c'2 | r4 …"  (1 ganze, 2 halbe, 4 Viertel, 8 Achtel, Punkt = punktiert, r = Pause) ---------- */
  function parseMelody(str) {
    var out = [], bar = 0;
    str.trim().split(/\s+/).forEach(function (tok) {
      if (tok === '|') { bar++; return; }
      var m = /^(r|fis|[a-h])('{0,2})(1|2|4|8)(\.?)$/.exec(tok);
      if (!m) throw new Error('Unbekannte Note: ' + tok);
      var beats = { 1: 4, 2: 2, 4: 1, 8: 0.5 }[m[3]] * (m[4] ? 1.5 : 1);
      out.push({ rest: m[1] === 'r', name: m[1] === 'r' ? null : m[1] + m[2], dur: +m[3], dot: !!m[4], beats: beats, bar: bar });
    });
    return out;
  }
  function barBeats(notes) { var b = []; notes.forEach(function (n) { b[n.bar] = (b[n.bar] || 0) + n.beats; }); return b; }

  /* ---------- Schwierigkeit je Insel (fair: steigt mit dem Können, siehe docs/KONZEPT.md Abschnitt 6) ---------- */
  var BANDS = [
    { upTo: 3,  tol: 50, hold: 0.25, longSec: 4,  th: [0.50, 0.70, 0.85] },
    { upTo: 7,  tol: 42, hold: 0.30, longSec: 6,  th: [0.60, 0.78, 0.90] },
    { upTo: 12, tol: 35, hold: 0.35, longSec: 8,  th: [0.65, 0.82, 0.93] },
    { upTo: 20, tol: 28, hold: 0.40, longSec: 10, th: [0.70, 0.86, 0.95] }
  ];
  function diff(island, tolAdj) {
    var b = BANDS[BANDS.length - 1];
    for (var i = 0; i < BANDS.length; i++) if (island <= BANDS[i].upTo) { b = BANDS[i]; break; }
    return { tol: Math.max(15, Math.min(50, b.tol + (tolAdj || 0))), hold: b.hold, longSec: b.longSec, th: b.th.slice() };
  }
  function starsFor(score, island) { var th = diff(island).th; return score >= th[2] ? 3 : score >= th[1] ? 2 : score >= th[0] ? 1 : 0; }
  // Auszahlung: neue Bestwert-Sterne, plus 1 Bonus-Stern für 3 Sterne bei Wiederholung (höchstens 2x pro Tag und Station)

let WL = null; function wake() { try { if (navigator.wakeLock && !WL) navigator.wakeLock.request('screen').then(w => { WL = w; w.addEventListener('release', () => { WL = null; }); }).catch(() => {}); } catch (e) {} }
function noteStat(name, okHit, cents) { const n = S.nt[name] || (S.nt[name] = { n: 0, ok: 0, cs: 0, cn: 0 }); n.n++; if (okHit) n.ok++; if (cents != null && isFinite(cents)) { n.cs += cents; n.cn++; } }
// Gemeinsamer Baustein: auf einen Zielton warten (Tonfolge, Ohren-Spiel, neuer Ton)
function waiter(D) {

    reset() { this.hold = 0; this.wrong = 0; this.wName = ''; this.miss = 0; this.cs = []; this.idle = 0; },
    step(fr, target, needHold) { // Rückgabe: 'ok' | 'miss' | null

const TYPES = {
  /* ----- neuer Ton: anhören, Griff ansehen, 1 Sekunde richtig spielen ----- */

      pre() { $('exL').innerHTML = `<div class="bigname">${name}</div><div class="staff" style="max-width:300px">${single(name)}</div>`; $('exFing').innerHTML = fingSVG(name); },
      begin() { this.t0 = now(); $('exL').innerHTML = `<div class="bigname">${name}</div><div class="staff" style="max-width:300px">${single(name)}</div><div class="meter"><i id="mt"></i></div>${tunerHTML()}<div class="hint" id="exHint">Spiel den Ton ${name}!</div>`; },
      frame(fr) {

        if (r === 'miss') { setHint(higher(w.wName, name) + ' – schau auf den Griff!'); sBad(); }

        if (r === 'ok') { noteStat(name, true, avg(w.cs)); finish(1); }

  /* ----- lange Töne ----- */

      demo() { playSeq(notes.map(n => ({ name: n, beats: 2 })), 60); },
      pre() { $('exL').innerHTML = `<div class="bigname">${notes.join(' ')}</div>`; $('exFing').innerHTML = fingSVG(notes[0]); },
      show() { const n = notes[k]; $('exFing').innerHTML = fingSVG(n); $('exL').innerHTML = `<div class="dots">${notes.map((x, i) => `<i class="${i < k ? (res[i] >= 0.99 ? 'ok' : 'bad') : i === k ? 'now' : ''}"></i>`).join('')}</div><div class="bigname">${n}</div><div class="staff" style="max-width:260px">${single(n)}</div><div class="meter"><i id="mt"></i></div>${tunerHTML()}<div class="hint" id="exHint">Halte den Ton ${n}!</div>`; hold = 0; bestH = 0; gap = 0; cs = []; t0 = now(); },
      begin() { this.show(); },

  /* ----- Anstoßen: einzelne Tonanfänge zählen ----- */

      demo() { playSeq(Array.from({ length: 4 }, () => [{ name, beats: 0.6 }, { name: null, beats: 0.4 }]).flat(), 90); },
      pre() { $('exFing').innerHTML = fingSVG(name); $('exL').innerHTML = `<div class="bigname">${name}</div>`; },

  /* ----- Lied im Takt mit Metronom ----- */
  song(st, D) {

      demo() { playSeq(notes, bpm, i => { document.querySelectorAll('#exL .n').forEach(e => e.classList.remove('now')); pageTo(notes[i].bar); mark(i, 'now'); }); },
      pre() { $('exL').innerHTML = `<div class="staff">${staffSVG(notes)}</div>`; pageTo(0); $('exFing').innerHTML = fingSVG(notes.find(n => !n.rest).name); },
      begin() {

  /* ----- Quiz ohne Klarinette ----- */
  quiz(st, D, islN) {

    const PORD = shuffle(PARTS.map((_, i) => i));

  $('parB').innerHTML = `<h1>👪 Elternbereich</h1><div class="cols">
  <div class="card"><h2>Übungszeit (letzte 7 Tage, Minuten)</h2><div class="bars">${bars}<i class="goal" style="bottom:${goal / max * 100}%"></i></div><p style="margin-top:30px">Diese Woche: <b>${wMin} min</b>, Tagesziel an <b>${wHit} von 7</b> Tagen erreicht · Serie: <b>${streak()} Tage</b> 🔥<br>Heute: ${Math.round(td.sec / 60)} min echte Spielzeit, ${td.ex} Übungen, ${td.stars} ⭐ verdient, ${td.games} Spielrunden.</p><p class="muted">Gezählt wird nur die Zeit, in der wirklich ein Ton erklingt – nicht die Zeit, in der die App offen ist.</p></div>
  <div class="card"><h2>Hausaufgabe der Lehrkraft</h2><p>Insel: ${sel('hwI', Array.from({ length: PLAYABLE }, (_, i) => [i + 1, (i + 1) + '. ' + isl(i + 1).name]), hwI)}</p><div id="hwL">${hwList(hwI)}</div><p><textarea id="hwT" rows="2" style="width:100%" placeholder="Notiz, z. B. Töne aushalten c d e f g, Kinn ruhig">${S.hw ? S.hw.txt || '' : ''}</textarea></p><button class="btn green" data-act="hwsave">Speichern</button><p class="muted">Markierte Übungen schlägt „Heute üben“ zuerst vor, jede einmal pro Tag.</p></div>
  <div class="card"><h2>Lernstand</h2><table>${prog}</table><p class="muted">Eine Insel öffnet sich, wenn auf der vorigen jede Übung mindestens einen Stern hat – oder hier unten in den Einstellungen.</p></div>
  <div class="card"><h2>Ton-Bericht</h2>${notes ? `<table><tr><th>Ton</th><th>Treffer</th><th>Stimmung im Schnitt</th></tr>${notes}</table>` : '<p>Noch keine Töne gespielt.</p>'}<p class="muted">Ist ein Ton dauerhaft zu hoch oder zu tief, lohnt eine Frage an die Lehrkraft (Ansatz, Blatt, Birne).</p></div>
  <div class="card"><h2>Einstellungen</h2><table>
   <tr><td>Tagesziel</td><td>${sel('sGoal', [5, 10, 15, 20, 25, 30].map(v => [v, v + ' Minuten']), goal)}</td></tr>
   <tr><td>Spielrunden pro Tag</td><td>${sel('sLim', [0, 2, 3, 5, 8, 10].map(v => [v, v]), S.set.gameLimit)}</td></tr>
   <tr><td>Offene Inseln bis</td><td>${sel('sUnl', Array.from({ length: PLAYABLE }, (_, i) => [i + 1, (i + 1) + '. ' + isl(i + 1).name]), Math.min(S.unlocked, PLAYABLE))}</td></tr>
   <tr><td>Tonprüfung</td><td>${sel('sTol', [[10, 'großzügig'], [0, 'normal'], [-10, 'streng']], S.set.tolAdj)}</td></tr>
   <tr><td>Stimmton a'</td><td>${sel('sA4', [438, 439, 440, 441, 442, 443].map(v => [v, v + ' Hz']), S.set.a4)}</td></tr></table>
   <button class="btn green" data-act="setsave">Speichern</button><button class="btn alt" data-act="reset">Spielstand löschen</button></div>
  <div class="card"><h2>So bewertet die App gerade</h2><p>Insel ${Math.min(S.unlocked, PLAYABLE)}: Ton gilt als richtig bis <b>±${D.tol} Cent</b>, in Tonfolgen <b>${D.hold} s</b> halten, lange Töne <b>${D.longSec} s</b>. Sterne ab ${D.th.map(x => Math.round(x * 100) + ' %').join(' / ')} Treffern.</p><p class="muted">Mit jeder Insel wird es in kleinen Schritten genauer (siehe Konzept). Wiederholte Übungen geben nur neue Bestwert-Sterne, bei 3 Sternen höchstens zweimal am Tag einen Bonus-Stern. Alle 5 Minuten echte Spielzeit gibt es einen Fleiß-Stern.</p><p class="muted">Datenschutz: Der Ton wird nur in diesem Gerät ausgewertet und nie gespeichert oder gesendet.</p></div>
  </div><div class="row"><button class="btn alt" data-act="home">🏠 Zurück</button></div>`;
}
function hwList(n) { const ids = S.hw && S.hw.isl == n ? S.hw.ids : []; return isl(n).st.map(s => `<label style="display:block;font-size:18px"><input type="checkbox" value="${s.id}"${ids.indexOf(s.id) >= 0 ? ' checked' : ''}> ${ICON[s.type]} ${s.title}</label>`).join(''); }

/* ================= Bedienung ================= */
document.addEventListener('click', e => {
  const b = e.target.closest ? e.target.closest('[data-act]') : null; if (!b) return;
  const a = b.dataset.act; ac();
  if (a === 'home') home();
  else if (a === 'today') openStation(nextStation());
  else if (a === 'map') map();
  else if (a === 'isl') island(+b.dataset.n);
  else if (a === 'locked') toast('🔒 Das ist noch zu. Erst die Übungen davor schaffen!');
  else if (a === 'go') openStation(b.dataset.id);
  else if (a === 'demo') { if (EX && EX.demo) EX.demo(); }
  else if (a === 'slow') { if (EX) { const on = !EX.slowOn; openStationBpm(EX.id, on ? Math.round(EX.st.bpm * 0.8) : EX.st.bpm, on); } }
  else if (a === 'begin') begin();
  else if (a === 'skipmic') { $('exGo').classList.remove('on'); if (EX && EX.demo) EX.demo(); toast('Ohne Mikrofon gibt es keine Sterne. Bitte die Eltern, das Mikrofon einzurichten.'); }
  else if (a === 'ans') { if (EX && EX.answer) EX.answer(b.dataset.v, b); }
  else if (a === 'again') openStation(EX ? EX.id : nextStation());
  else if (a === 'nextst') openStation(nextAfter(EX ? EX.id : nextStation()));
  else if (a === 'back') { if (EX) island(EX.isl); else home(); }
  else if (a === 'shop') shop();
  else if (a === 'buy') { const it = item(b.dataset.id); if (S.stars >= it.p) { S.stars -= it.p; S.own.push(it.id); S.wear[it.slot] = it.id; save(); sStar(); shop('Oh, wie schön! Danke! ' + it.ic); anim('sAlp', 'salto'); } else shop('Dafür brauchst du ' + it.p + ' ⭐. Übe noch ein bisschen!'); }
  else if (a === 'buyc') { const c = CONS.find(x => x.id === b.dataset.id); if (S.stars >= c.p) { S.stars -= c.p; S.cons[c.id]++; save(); sStar(); shop(c.ic + ' gekauft!'); } else shop('Dafür brauchst du ' + c.p + ' ⭐.'); }
  else if (a === 'wear') { const w = item(b.dataset.id); if (S.wear[w.slot] === w.id) delete S.wear[w.slot]; else S.wear[w.slot] = w.id; save(); shop(); }
  else if (a === 'run') runMenu();
  else if (a === 'rungo') runGo(+b.dataset.l);
  else if (a === 'tuner') tuner();
  else if (a === 'par') parGate();
  else if (a === 'gate') { if (+b.dataset.v === GATE) parents(); else home(); }
  else if (a === 'hwsave') { const n = +$('hwI').value; S.hw = { isl: n, ids: [...document.querySelectorAll('#hwL input:checked')].map(i => i.value), txt: $('hwT').value, date: today() }; save(); toast('Hausaufgabe gespeichert ✓'); }
  else if (a === 'setsave') { S.set.goal = +$('sGoal').value; S.set.gameLimit = +$('sLim').value; S.unlocked = +$('sUnl').value; S.set.tolAdj = +$('sTol').value; S.set.a4 = +$('sA4').value; save(); hud(); toast('Gespeichert ✓'); parents(); }
  else if (a === 'reset') { if (window.confirm('Wirklich den ganzen Spielstand löschen? Sterne, Sachen und Übungszeiten sind dann weg.')) { S = fresh(); save(); home(); } }
  else if (a === 'snd') { S.set.mute = !S.set.mute; save(); hud(); if (!S.set.mute) sOk(); }
});
document.addEventListener('change', e => { if (e.target.id === 'hwI') $('hwL').innerHTML = hwList(+e.target.value); });
function openStationBpm(id, bpm, slowOn) { const r = KL.station(id); const st = Object.assign({}, r.st, { bpm }); stopEx(); exShell(r.st.title); const D = KL.diff(r.isl.n, S.set.tolAdj); EX = TYPES[st.type](st, D, r.isl.n); EX.id = id; EX.st = r.st; EX.isl = r.isl.n; EX.D = D; EX.slowOn = slowOn; intro(); }
$('runF').addEventListener('pointerdown', e => { if (G && G.on) { e.preventDefault(); runJump(); } });
document.addEventListener('keydown', e => { if (screen === 'run' && (e.key === ' ' || e.key === 'ArrowUp')) { e.preventDefault(); runJump(); } });

/* Testhilfen (nur mit URL-Parametern): ?sim=1&auto=1&speed=4  ·  ?demo=<StationsID>|map|shop|run|par|tun */
window.KLAPP = { get S() { return S; }, get EX() { return EX; }, openStation, home, finish, day };
const demo = Q.get('demo');
if (demo) {
  S = fresh(); save = () => {}; S.unlocked = 6;
  if (demo === 'shop') { S.stars = 30; S.own = ['phones', 'notes', 'helmet', 'wings']; S.wear = { hat: 'phones', fx: 'notes', back: 'wings' }; shop(); }
  else if (demo === 'par') { for (let i = 0; i < 7; i++) S.days[dayKey(i)] = { sec: [900, 1200, 300, 0, 1000, 600, 950][i], ex: 4, stars: 3, fs: 2, games: 2 }; S.nt = { "c'": { n: 20, ok: 18, cs: -120, cn: 18 }, "d'": { n: 15, ok: 14, cs: 40, cn: 14 }, h: { n: 10, ok: 6, cs: -210, cn: 6 } }; ['L3-lied', 'L4-lied', 'L3-d'].forEach(id => { stat(id).best = 2; }); parents(); }
  else if (demo === 'map') map();
  else if (demo === 'run') { S.tix = 3; runMenu(); }
  else if (demo === 'tun') tuner();
  else if (KL.station(demo)) { openStation(demo); if (Q.has('go')) begin(); }
  else home();
} else home();
})();
</script>
</body>
</html>
