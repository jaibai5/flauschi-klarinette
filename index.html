<!DOCTYPE html>
<html lang="de">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no">

<title>Klarinetten-Abenteuer</title>

<!-- Gebaut aus src/ mit: node tools/build.mjs · Nicht direkt bearbeiten, sondern die Dateien in src/ ändern. -->
<style>*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
html,body{margin:0;height:100%;overflow:hidden;font-family:"Trebuchet MS","Segoe UI",Roboto,Arial,sans-serif;color:#3a2d4a;background:linear-gradient(160deg,#fff4fb 0%,#eef6ff 55%,#f1fff0 100%)}
button{font-family:inherit;cursor:pointer;touch-action:manipulation}
#app{position:fixed;inset:0;display:flex;flex-direction:column}
#hud{display:flex;align-items:center;gap:8px;padding:6px 10px;min-height:54px;background:rgba(255,255,255,.75);box-shadow:0 2px 8px rgba(90,70,104,.12);z-index:5}
#hud .sp{flex:1}
.chip{display:inline-flex;align-items:center;gap:4px;background:#fff;border:2px solid #e4d7f2;border-radius:22px;padding:4px 12px;font-weight:800;font-size:20px;white-space:nowrap}
.ib{border:0;background:#fff;border-radius:16px;font-size:24px;width:48px;height:44px;box-shadow:0 2px 0 #d9cbe8}
#tday{position:relative;overflow:hidden;min-width:150px}
#tday i{position:absolute;left:0;top:0;bottom:0;background:#c9f2c4;z-index:0;transition:width .5s}
#tday span{position:relative;z-index:1}
main{flex:1;position:relative;overflow:hidden}
.scr{position:absolute;inset:0;display:none;padding:12px 16px;overflow-y:auto}
.scr.on{display:block}
h1{margin:4px 0 8px;font-size:32px}
h2{margin:4px 0 8px;font-size:26px}
.btn{border:0;border-radius:22px;padding:14px 26px;font-size:24px;font-weight:800;color:#fff;background:#7b5cff;box-shadow:0 5px 0 #5a3cc0;margin:6px}
.btn:active{transform:translateY(3px);box-shadow:0 2px 0 #5a3cc0}
.btn.pink{background:#ff4f8b;box-shadow:0 5px 0 #c2185b}
.btn.green{background:#2fb35a;box-shadow:0 5px 0 #1d7d3c}
.btn.alt{background:#fff;color:#5a4668;box-shadow:0 5px 0 #d9cbe8;border:2px solid #e4d7f2}
.btn.huge{font-size:34px;padding:22px 40px;border-radius:30px}
.btn:disabled{opacity:.45}
.row{display:flex;flex-wrap:wrap;align-items:center;justify-content:center;gap:4px}
.card{background:#fff;border-radius:26px;padding:16px 20px;box-shadow:0 6px 18px rgba(90,70,104,.12)}
.say{background:#fff;border-radius:24px;padding:12px 18px;font-size:24px;font-weight:700;position:relative;box-shadow:0 4px 12px rgba(90,70,104,.12)}
.muted{color:#7d6d8c;font-size:18px}
/* Start */
#home .wrap{display:flex;height:100%;align-items:center;justify-content:center;gap:24px}
#hAlp{width:min(34vw,300px)}
.hfig{display:flex;flex-direction:column;align-items:center}
.tag{background:#fff;border-radius:16px;padding:2px 14px;font-weight:900;font-size:20px;box-shadow:0 3px 8px rgba(90,70,104,.15);margin-top:-6px}
.mlab{font-size:15px;font-weight:800;color:#7d6d8c;margin:2px 10px -4px;text-transform:uppercase;letter-spacing:1px}
#home .menu{display:flex;flex-direction:column;align-items:stretch;gap:6px;min-width:330px}
/* Karte */
#map .grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(150px,1fr));gap:12px}
.isl{border:0;border-radius:24px;background:#fff;padding:10px;text-align:center;box-shadow:0 5px 0 #d9cbe8;min-height:132px}
.isl b{display:block;font-size:44px}
.isl span{display:block;font-weight:800;font-size:17px}
.isl small{display:block;font-size:14px;color:#7d6d8c}
.isl.lock{background:#eee8f3;color:#9b8fa8;box-shadow:none}
.isl.cur{outline:4px solid #ffcf2e}
.isl.soon{background:transparent;border:3px dashed #d9cbe8;box-shadow:none;color:#9b8fa8}
/* Insel */
#isl .grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(190px,1fr));gap:12px}
.stn{border:0;border-radius:22px;background:#fff;padding:12px;text-align:left;box-shadow:0 5px 0 #d9cbe8;display:flex;gap:10px;align-items:center;min-height:86px}
.stn .ic{font-size:36px;flex:none}
.stn .ic .ci{width:40px;height:40px;vertical-align:middle}
.stn .no{flex:none;width:28px;height:28px;border-radius:50%;background:#efe6f7;font-weight:900;font-size:16px;display:flex;align-items:center;justify-content:center;color:#5a4668}
.stn .k{font-size:14px;color:#7d6d8c;font-weight:700}
.stn.next{outline:4px solid #ffcf2e;animation:pulse 1.6s infinite}
.stn.next .no{background:#ffcf2e}
@keyframes pulse{50%{outline-color:#ffe99a}}
.stn .t{font-weight:800;font-size:19px}
.stn .s{font-size:16px;letter-spacing:1px}
.stn.hw{outline:4px solid #ff4f8b}
/* Übung */
#ex{display:none;flex-direction:column;padding:8px 14px}
#ex.on{display:flex}
#exTop{display:flex;align-items:center;gap:10px}
#exTop h2{flex:1;margin:0}
#exBody{flex:1;display:flex;align-items:center;justify-content:center;gap:18px;min-height:0}
#exL{flex:1;display:flex;flex-direction:column;align-items:center;justify-content:center;min-width:0;height:100%}
#exR{width:170px;display:flex;flex-direction:column;align-items:center;gap:6px}
#exFing svg{width:150px;height:auto}
#exAlp{width:140px}
.bigname{font-size:64px;font-weight:900;line-height:1}
.staff{width:100%;max-width:980px}
.staff svg{width:100%;height:auto;display:block}
.n{fill:#3a2d4a;stroke:#3a2d4a}
.n.now{fill:#7b5cff;stroke:#7b5cff}
.n.ok{fill:#2fb35a;stroke:#2fb35a}
.n.bad{fill:#ff4f8b;stroke:#ff4f8b}
.n .hol{fill:#fff}
.meter{width:min(560px,90%);height:34px;border-radius:18px;background:#f0e8f8;overflow:hidden;border:3px solid #e4d7f2;margin:8px}
.meter i{display:block;height:100%;width:0;background:linear-gradient(90deg,#8ee08a,#2fb35a);transition:width .12s}
.hint{font-size:26px;font-weight:800;min-height:36px;text-align:center}
.dots{display:flex;gap:10px;justify-content:center;margin:6px}
.dots i{width:30px;height:30px;border-radius:50%;background:#efe6f7;border:3px solid #e4d7f2}
.dots i.ok{background:#2fb35a;border-color:#1d7d3c}
.dots i.bad{background:#ff4f8b;border-color:#c2185b}
.dots i.now{border-color:#7b5cff;background:#d8ccff}
.ring{width:190px;height:190px;border-radius:50%;display:flex;align-items:center;justify-content:center;font-size:30px;font-weight:900;background:#e9f6ff;border:8px solid #7cc8ff;transition:transform 1s linear}
.ov{position:absolute;inset:0;background:rgba(255,246,252,.94);display:none;align-items:center;justify-content:center;z-index:8;flex-direction:column;text-align:center;padding:16px}
.ov.on{display:flex}
.stars{font-size:72px;letter-spacing:6px}
.stars .off,.stn .s .off{filter:grayscale(1);opacity:.3}
.opts{display:grid;grid-template-columns:1fr 1fr;gap:12px;width:min(640px,95%)}
.opt{border:0;border-radius:22px;background:#fff;font-size:30px;font-weight:900;padding:18px;box-shadow:0 5px 0 #d9cbe8;color:#3a2d4a}
.opt.good{background:#c9f2c4}
.opt.no{background:#ffd1df}
.cnt{font-size:120px;font-weight:900;color:#7b5cff}
/* Laden */
#shop .grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(150px,1fr));gap:10px}
.item{border:0;border-radius:20px;background:#fff;padding:8px;box-shadow:0 4px 0 #d9cbe8;text-align:center;font-weight:800}
.item b{display:block;font-size:40px}
.item.own{background:#f0fff0}
.item.wear{outline:4px solid #2fb35a}
.item.lock{opacity:.45}
.item small{display:block;font-weight:600;font-size:13px;color:#7d6d8c}
#shop .top{display:flex;gap:16px;align-items:center}
#sAlp{width:170px;flex:none}
/* Spiel */
#run{padding:0}
#runF{position:absolute;inset:0;overflow:hidden;touch-action:none}
#runG{position:absolute;left:0;right:0;bottom:0;height:56px}
#runA{position:absolute;left:50px;bottom:56px;width:100px;z-index:3}
#runA.inv{opacity:.5}
.ob{position:absolute;left:0;font-size:40px;line-height:1;z-index:2}
#runH{position:absolute;left:10px;top:10px;display:flex;gap:6px;z-index:4}
#runM{position:absolute;inset:0;display:flex;align-items:center;justify-content:center;z-index:6;background:rgba(255,255,255,.55)}
.lvl{display:grid;grid-template-columns:repeat(5,64px);gap:8px;justify-content:center;margin:8px}
.lvl button{height:60px;border:0;border-radius:16px;font-size:20px;font-weight:900;background:#fff;box-shadow:0 4px 0 #d9cbe8}
.lvl button.done{background:#c9f2c4}
.lvl button:disabled{opacity:.35}
/* Eltern */
#par table{border-collapse:collapse;width:100%;font-size:17px}
#par td,#par th{border-bottom:1px solid #eee3f5;padding:6px;text-align:left}
.bars{display:flex;gap:8px;align-items:flex-end;height:150px;padding:6px;border-bottom:3px solid #e4d7f2;position:relative}
.bars div{flex:1;background:#7cc8ff;border-radius:8px 8px 0 0;position:relative;min-height:2px}
.bars div.hit{background:#2fb35a}
.bars div span{position:absolute;bottom:-24px;left:0;right:0;text-align:center;font-size:13px}
.bars div em{position:absolute;top:-20px;left:0;right:0;text-align:center;font-size:13px;font-style:normal;font-weight:800}
.goal{position:absolute;left:0;right:0;border-top:2px dashed #ff4f8b}
#par select,#par input,#par textarea{font-size:18px;padding:6px;border-radius:10px;border:2px solid #e4d7f2;font-family:inherit}
.cols{display:grid;grid-template-columns:1fr 1fr;gap:14px}
/* Flauschi-Animation */
.salto{animation:salto .9s ease}
@keyframes salto{0%{transform:translateY(0) rotate(0)}40%{transform:translateY(-70px) rotate(-180deg)}80%{transform:translateY(-10px) rotate(-360deg)}100%{transform:translateY(0) rotate(-360deg)}}
.hop{animation:hop .5s ease}
@keyframes hop{50%{transform:translateY(-22px)}}
.tw{animation:tw 1.4s infinite}.tw.b{animation-delay:.4s}.tw.c{animation-delay:.8s}
@keyframes tw{50%{opacity:.2}}
#toast{position:fixed;left:50%;top:70px;transform:translateX(-50%);background:#3a2d4a;color:#fff;font-weight:800;font-size:22px;padding:10px 20px;border-radius:20px;display:none;z-index:20}
.conf{position:fixed;top:-40px;font-size:34px;animation:fall 2.6s linear forwards;z-index:30;pointer-events:none}
@keyframes fall{to{transform:translateY(110vh) rotate(540deg)}}
@media (orientation:portrait){#home .wrap{flex-direction:column}#hAlp{width:44vw}#exBody{flex-direction:column}#exR{flex-direction:row;width:auto}.cols{grid-template-columns:1fr}}
@media (max-height:620px){h1{font-size:26px}.bigname{font-size:48px}.btn.huge{font-size:28px;padding:16px 30px}.cnt{font-size:90px}#exFing svg{width:116px}#exAlp{width:66px}}
.gauge{width:min(230px,60%);height:auto;display:block;margin:2px auto}
.gauge.big{width:min(460px,90%)}
.gauge .nd{transform-origin:150px 150px;transform-box:view-box;transition:transform .12s ease-out,opacity .3s}
.gauge .nd.off{opacity:.25}
.demoV{display:none;gap:18px;align-items:center;justify-content:center;margin-top:8px;background:#fff;border-radius:22px;padding:4px 16px;box-shadow:0 4px 14px rgba(80,40,120,.12)}
.demoV.on{display:flex}
.demoV .dn{display:flex;flex-direction:column;align-items:center}
.demoV .dn .bigname{font-size:52px;line-height:1}
.demoV .staff{width:170px}
.demoV .df svg{height:170px;width:auto}
.ov.demo .say{font-size:20px;padding:10px 18px}
.ov.demo .btn.huge{padding-top:8px;padding-bottom:8px}
.ov.demo>p.muted{display:none}

/* Übung: Overlay lässt die Kopfzeile mit „Aufhören“ frei */
#ex .ov{top:52px}
.exrow{display:flex;align-items:center;justify-content:center;gap:18px;flex:none;max-width:100%}
.exrow .nb{display:flex;flex-direction:column;align-items:center}
.exrow .hint{min-width:160px;text-align:left}
.staff.sm{width:200px;flex:none}
.staff.one{flex:none}
.bigicon .ci{width:90px;height:90px}
.gauge{flex:none;width:min(280px,42vw)}
.gauge.big{width:min(460px,90%)}
#exL>*{flex-shrink:0}
/* Quiz */
.qq{margin:2px 0 6px;text-align:center}
.qz{display:flex;align-items:center;justify-content:center;gap:24px;width:100%}
.qz .qimg{display:flex;justify-content:center;flex:none}
.qz .qimg .staff{width:260px}
.qz .qf svg{width:auto;height:min(300px,52vh)}
.qz .opts{width:min(460px,55%)}
.qz.wide{flex-direction:column;gap:10px}
.qz.wide .qimg{width:100%}
.qz.wide .qimg svg{width:100%;max-width:900px;height:auto}
.qz.wide .opts{grid-template-columns:repeat(4,1fr);width:100%}
.qz .opt{font-size:24px;padding:14px 8px}
/* Ergebnis */
.btn.nx small{display:block;font-size:16px;font-weight:700;opacity:.9}
/* Figurenwahl, Name, Optionen */
#who h1{text-align:center}
.chars{display:grid;grid-template-columns:repeat(4,1fr);gap:14px;max-width:960px;margin:0 auto}
.chr{border:0;border-radius:24px;background:#fff;padding:10px 8px;box-shadow:0 5px 0 #d9cbe8;display:flex;flex-direction:column;align-items:center}
.chr svg{width:100%;max-width:170px;height:auto}
.chr b{font-size:26px}
.chr small{font-size:16px;color:#7d6d8c;font-weight:700}
.chr.sel{outline:5px solid #2fb35a}
.namebox{display:flex;gap:20px;align-items:center;max-width:900px;margin:10px auto}
.nmalp{width:220px;flex:none}
#nameI{width:100%;font-size:34px;font-weight:800;padding:10px 16px;border-radius:18px;border:3px solid #d9cbe8;font-family:inherit;color:#3a2d4a;margin:8px 0}
#opt .card{margin-bottom:12px}
.lvl button:disabled{opacity:.6;background:#eee8f3}
@media (orientation:portrait){.chars{grid-template-columns:1fr 1fr}.namebox{flex-direction:column}.qz{flex-direction:column}.qz .opts{width:100%}.exrow{flex-wrap:wrap}}
@media (max-height:620px){.chr svg{max-width:140px}.nmalp{width:170px}}
/* v0.2.0: Tagesmissionen, Versionshinweis, falscher Ton, Zusatzmeldungen im Ergebnis */
.mis{display:flex;flex-wrap:wrap;align-items:center;gap:6px;background:#fff;border:2px solid #e4d7f2;border-radius:20px;padding:6px 8px}
.mis .mt{font-size:13px;font-weight:800;color:#7d6d8c;text-transform:uppercase;letter-spacing:1px;margin:0 2px}
.mp{border:2px solid #e4d7f2;background:#faf6ff;border-radius:16px;padding:5px 10px;font-size:16px;font-weight:800;color:#5a4668;display:inline-flex;align-items:center;gap:5px}
.mp .mi{font-size:18px}.mp .mi .ci{width:20px;height:20px;vertical-align:middle}
.mp small{color:#7b5cff}
.mp.done{background:#e3f8e6;border-color:#8fd89d;color:#1d7d3c}
.mis .chest{font-size:26px;cursor:pointer;line-height:1}
.mis .chest.open{animation:hop .9s ease 1}
.ver{position:absolute;right:12px;bottom:6px;font-size:13px;color:#9a8aa8;font-weight:700;cursor:pointer}
.hint .wrong b,.say .wrong b{color:#c2185b}
.xtra{font-size:19px;font-weight:800;color:#1d7d3c;margin:2px 0 6px}
@media (max-height:620px){.mp{font-size:15px;padding:4px 8px}.mis{padding:4px 6px}}
/* Kleine Bildschirme (Fire HD 8 im Browser ohne Vollbild: etwa 850 x 480) */
@media (max-height:540px){
#hud{min-height:44px;padding:4px 8px}.chip{font-size:17px;padding:2px 10px}.ib{height:38px;width:42px;font-size:21px}#tday{min-width:120px}
#home .say{font-size:18px;padding:8px 14px}#home .menu{gap:3px}#home .mlab{display:none}
#home .btn{font-size:21px;padding:9px 18px;margin:4px}#home .btn.huge{font-size:26px;padding:10px 24px}
#hAlp{width:min(30vw,240px)}.ver{bottom:2px;font-size:11px}
.mp{font-size:14px;padding:3px 8px}.mis{gap:4px}
}
/* 3D (v0.4, nur Testseite): Start, Karte und Laden mit three.js; ohne 3D gelten die Regeln oben */
.bg3d{position:absolute;inset:0;z-index:0}
#home.g3d{padding:0;overflow:hidden}
#home.wait3d .tag{visibility:hidden}
#home.wait3d{background:linear-gradient(#7fcfff 0%,#e6f7ff 48%,#5fcdf2 52%,#3fbfef 100%)}
.ph3d{width:100%;aspect-ratio:204/246}
@keyframes in3d{from{opacity:0}to{opacity:1}}
.bg3d,.map3d,.fig3d canvas{animation:in3d .45s ease-out}
#home.g3d .wrap{position:relative;z-index:1;padding:12px 16px;pointer-events:none}
#home.g3d .wrap>*{pointer-events:auto}
#home.g3d .hfig{pointer-events:none}
#home.g3d #hAlp{visibility:hidden}
#home.g3d .menu{background:rgba(255,255,255,.62);border-radius:26px;padding:10px 12px;box-shadow:0 8px 26px rgba(40,60,110,.18)}
#home.g3d .tag{position:relative;top:-6px}
#home.g3d .ver{z-index:1;color:#fff;text-shadow:0 1px 2px rgba(0,0,0,.4)}
#map.g3d{padding:0;overflow:hidden}
#map.g3d>h1{position:absolute;left:14px;top:8px;z-index:3;margin:0;display:flex;gap:12px;align-items:center;color:#fff;text-shadow:0 2px 4px rgba(30,60,100,.45)}
#map.g3d>h1 .btn{font-size:17px;padding:6px 14px;text-shadow:none}
#map.g3d #mapG{display:none}
#map.g3d.list{padding:12px 16px;overflow-y:auto}
#map.g3d.list>h1{position:static;color:inherit;text-shadow:none;margin-bottom:8px}
#map.g3d.list #mapG{display:grid}
#map.g3d.list .map3d{display:none}
.map3d{position:absolute;inset:0;z-index:0}
.map3d .labs{position:absolute;inset:0;pointer-events:none;z-index:2;overflow:hidden}
.lab3d{position:absolute;left:0;top:0;pointer-events:auto;border:0;border-radius:18px;background:rgba(255,255,255,.94);box-shadow:0 4px 0 #cdbde0,0 6px 14px rgba(40,40,90,.2);padding:5px 12px 6px;display:flex;flex-direction:column;align-items:center;font-weight:800;color:#3a2d4a;min-width:120px;will-change:transform}
.lab3d b{position:absolute;left:-10px;top:-10px;width:30px;height:30px;border-radius:50%;background:#7b5cff;color:#fff;font-size:17px;display:flex;align-items:center;justify-content:center;box-shadow:0 2px 0 #5a3cc0}
.lab3d span{font-size:18px;white-space:nowrap}
.lab3d small{font-size:13px;color:#7d6d8c;white-space:nowrap}
.lab3d.cur{outline:4px solid #ffcf2e}
.lab3d.lock{background:rgba(235,230,242,.92);color:#8a7d99}
.lab3d.lock b{background:#a99cb8;box-shadow:none}
.lab3d.soon{background:rgba(255,255,255,.7)}
.lab3d.soon b{background:none;box-shadow:none;font-size:22px}
.lab3d:active{transform:translateY(2px)}
.hint3d{position:absolute;left:50%;bottom:14px;transform:translateX(-50%);z-index:2;background:rgba(255,255,255,.8);border-radius:20px;padding:4px 16px;font-weight:800;color:#5a4668;pointer-events:none;transition:opacity .6s}
#sAlp.fig3d{height:200px;touch-action:none}
img.f3d{width:100%;height:auto;display:block;-webkit-user-drag:none;user-select:none}
.chr img.f3d{max-width:190px}
@media (max-height:620px){.lab3d span{font-size:16px}.lab3d{min-width:100px;padding:3px 10px 4px}#sAlp.fig3d{height:160px}.chr img.f3d{max-width:150px}}
</style>
</head>
<body>
<div id="app">
  <div id="hud">
    <button class="ib" id="bHome" data-act="home" aria-label="Start">🏠</button>
    <span class="chip" id="hStar" data-act="info" data-k="star">⭐ 0</span><span class="chip" id="hTix" data-act="info" data-k="tix">🎟️ 0</span><span class="chip" id="hFire" data-act="info" data-k="fire">🔥 0</span>
    <span class="sp"></span>
    <span class="chip" id="tday" data-act="info" data-k="day"></span>
    <button class="ib" id="bSnd" data-act="snd" aria-label="Ton">🔊</button>
    <button class="ib" id="bOpt" data-act="opt" aria-label="Optionen">⚙️</button>
  </div>
  <main>
    <section class="scr" id="home"><div class="wrap">
      <div class="hfig"><div id="hAlp"></div><span class="tag" id="hTag"></span></div>
      <div class="menu">
        <div class="say" id="hSay"></div>

function jitter(g, amt, r0, onlyTop) {

// Grundkörper einer Insel: Fels unter Wasser, Sandrand, Wiese
function islandBase(r, o) {

  const rock = new T.Mesh(jitter(new T.CylinderGeometry(r * 1.08, r * 0.55, 1.6, 9, 1), 0.25, r), LM(0x9a8a7a, gr)); rock.position.y = -0.9; g.add(rock);

function put(g, name, x, z, s, ry, o) {

// Ausstattung je Insel (Themen aus den Namen); vorne in der Mitte bleibt Platz für Figur und Schild
const THEME = {
  1: (g, R, gr) => { [[0xff5a8a, -0.6, -0.4, 1.3], [0xffcf2e, -0.2, -0.75, 1.55], [0x7cc8ff, 0.3, -0.6, 1.4], [0xa996ff, 0.7, -0.2, 1.25], [0x8ee08a, 0.05, -0.2, 1.7]].forEach(b => { const x = balloon(b[0], b[3], gr); x.position.set(b[1], g.top, b[2]); g.add(x); (g.anim = g.anim || []).push(x); });
    put(g, 'plant_bushDetailed', -0.9, 0.2, 1, 0, { y: g.top, grey: gr }); put(g, 'flower_redA', 0.8, 0.4, 1.4, 0, { y: g.top, grey: gr }); put(g, 'flower_yellowA', 0.95, 0.15, 1.4, 1, { y: g.top, grey: gr }); put(g, 'flower_purpleA', -0.7, 0.6, 1.4, 2, { y: g.top, grey: gr }); },
  2: (g, R, gr) => { [['tree_oak', -0.7, -0.5, 1], ['tree_default', 0.1, -0.85, 1], ['tree_detailed', 0.75, -0.45, 1], ['tree_pineRoundA', -1.05, 0.15, 0.9], ['tree_fat', 1.05, 0.2, 0.85]].forEach(t => put(g, t[0], t[1], t[2], t[3], R() * 6, { y: g.top, grey: gr }));
    put(g, 'mushroom_redGroup', -0.4, 0.5, 1.5, 0, { y: g.top, grey: gr }); put(g, 'stump_round', 0.6, 0.55, 1.2, 0, { y: g.top, grey: gr }); },
  3: (g, R, gr) => { put(g, 'tree_palm', -0.8, -0.5, 1.1, 0.5, { y: g.top, grey: gr }); put(g, 'tree_palmBend', 0.7, -0.6, 1.1, 2.5, { y: g.top, grey: gr }); put(g, 'tree_palmTall', 0.0, -0.95, 1, 1, { y: g.top, grey: gr });
    put(g, 'canoe', 1.15, 0.45, 1.3, 0.7, { y: 0.08, grey: gr }); put(g, 'pi-chest', -1.0, 0.45, 0.3, 0.4, { y: 0.1, grey: gr }); put(g, 'rock_smallA', 0.55, 0.85, 1.2, 0, { y: 0.08, grey: gr }); },
  4: (g, R, gr) => { put(g, 'cliff_block_rock', -0.55, -0.55, 0.9, 0, { y: g.top, grey: gr }); put(g, 'cliff_block_rock', -0.55, -0.55, 0.65, 0.4, { y: g.top + 0.85, grey: gr }); put(g, 'rock_tallA', 0.5, -0.6, 1.1, 1, { y: g.top, grey: gr });
    put(g, 'tree_pineSmallA', -1.0, 0.2, 0.9, 0, { y: g.top, grey: gr }); put(g, 'tree_pineSmallA', 1.0, 0.0, 0.8, 1, { y: g.top, grey: gr }); put(g, 'rock_largeB', 0.7, 0.55, 0.6, 2, { y: g.top, grey: gr }); put(g, 'pf-flag', -0.55, -0.55, 0.6, 0, { y: g.top + 1.45, grey: gr }); },
  5: (g, R, gr) => { [['tree_oak_dark', -0.75, -0.5, 1.1], ['tree_cone_dark', 0.2, -0.9, 1.1], ['tree_default_dark', 0.85, -0.4, 1]].forEach(t => put(g, t[0], t[1], t[2], t[3], R() * 6, { y: g.top, grey: gr }));
    put(g, 'mushroom_redTall', -0.9, 0.35, 2.4, 0, { y: g.top, grey: gr }); put(g, 'mushroom_redGroup', 0.85, 0.45, 2, 0, { y: g.top, grey: gr }); put(g, 'statue_ring', -0.1, -0.35, 0.8, 0, { y: g.top, grey: gr });
    if (!gr) { const s = new T.Sprite(new T.SpriteMaterial({ map: K.glowTex('rgba(200,150,255,1)'), transparent: true, depthWrite: false, blending: T.AdditiveBlending })); s.scale.setScalar(1.3); s.position.set(-0.1, g.top + 0.45, -0.35); g.add(s); (g.glows = g.glows || []).push(s); } },
  6: (g, R, gr) => { const w = new T.Mesh(new T.BoxGeometry(0.42, 0.06, 2.3), LM(0x46c4f0, gr ? { grey: 1 } : null)); w.position.set(0.15, g.top - 0.02, -0.05); w.rotation.y = 0.3; g.add(w);
    put(g, 'bridge_wood', 0.15, 0.0, 0.8, 0.3, { y: g.top - 0.02, grey: gr }); put(g, 'tent_detailedOpen', -0.75, -0.45, 1.1, 0.6, { y: g.top, grey: gr }); put(g, 'campfire_stones', -0.6, 0.35, 1, 0, { y: g.top, grey: gr });
    put(g, 'tree_default', 0.9, -0.55, 0.9, 1, { y: g.top, grey: gr }); put(g, 'lily_large', 0.05, -0.8, 1, 0, { y: g.top + 0.01, grey: gr }); },
  soon: (g, R, gr) => { put(g, 'sign', 0.25, 0.1, 1.6, -0.3, { y: g.top, grey: true }); put(g, 'pi-barrel', -0.5, -0.3, 0.25, 0, { y: g.top, grey: true }); put(g, 'fence_simple', 0, -0.2, 0.9, 0, { y: g.top, grey: true }); put(g, 'tree_pineSmallA', 0.55, -0.55, 0.8, 0, { y: g.top, grey: true }); },
  home: (g, R) => { put(g, 'tree_oak', -0.95, -0.7, 1.15, 0.4, { y: g.top }); put(g, 'tree_palmBend', 1.15, -0.55, 1.1, 2.6, { y: g.top }); put(g, 'tree_fat', -0.2, -1.15, 1, 1, { y: g.top });
    put(g, 'plant_bushDetailed', 1.0, 0.45, 0.9, 0, { y: g.top }); put(g, 'flower_redA', -0.85, 0.5, 1.6, 0, { y: g.top }); put(g, 'flower_yellowB', -0.65, 0.75, 1.6, 1, { y: g.top }); put(g, 'flower_purpleA', 0.7, 0.85, 1.6, 2, { y: g.top });
    put(g, 'mushroom_redGroup', -1.15, 0.05, 1.4, 0, { y: g.top }); put(g, 'rock_smallA', 1.35, 0.1, 1.2, 0, { y: 0.06 }); put(g, 'pf-chest', 0.45, -0.75, 0.8, -0.4, { y: g.top }); }

function island(n, o) {

function clouds(scene, n, spread, y) {

  return list;
}
function noteSprites(scene, n) { const a = []; for (let i = 0; i < n; i++) { const s = K.textSprite(i % 2 ? '♫' : '♪', { color: ['#ff4f8b', '#7b5cff', '#2fb35a', '#ffb03a'][i % 4], size: 72, h: 0.32 }); s.ph = i / n; scene.add(s); a.push(s); } return a; }

/* ---------- Startbildschirm ---------- */
let HOME = null;
A.home = (sec, S, figEl) => {
  T = K.T; A.leave();
  let host = sec.querySelector('.bg3d'); if (!host) { host = document.createElement('div'); host.className = 'bg3d'; sec.insertBefore(host, sec.firstChild); }
  sec.classList.add('g3d');
  const scene = new T.Scene(); scene.background = K.sky('#7fcfff', '#e6f7ff'); scene.fog = new T.Fog(0xdff3ff, 14, 40);
  const L = K.lights(scene, { size: 3.2, sx: 3, sz: 5 });
  const cam = new T.PerspectiveCamera(32, 1, 0.1, 80);
  const water = K.water(120, 60, 0x3fbfef); water.position.set(0, 0, -10); scene.add(water);
  const isl = island(0, { theme: 'home', r: 1.75 }); scene.add(isl);
  [[-9, -16, 1.3, 2], [7, -20, 1.6, 3], [16, -12, 1.1, 4]].forEach(p => { const x = island(p[3], { r: p[2] }); x.position.set(p[0], 0, p[1]); scene.add(x); });

    const cx = b.width ? b.left + b.width / 2 - hb.left : w * 0.28, cy = b.height ? b.top + b.height * 0.55 - hb.top : h * 0.55;

    scene, camera: cam, resize: fit,
    update(dt, t) {

      cl.forEach(c => { c.position.x += c.sp * dt; if (c.position.x > 18) c.position.x = -18; });
      wave -= dt; if (wave < 0) wave = 7 + Math.random() * 4;
      if (jump > 0) { jump -= dt; fig.pose(t, 'cheer'); } else fig.pose(t, wave < 1.6 ? 'wave' : 'idle');
      notes.forEach(s => { const p = (t * 0.22 + s.ph) % 1; s.position.set(0.5 + Math.sin(p * 7 + s.ph * 6) * 0.35, 1.3 + p * 1.6, 0.3); s.material.opacity = Math.sin(p * Math.PI) * 0.9; });
      if (isl.anim) isl.anim.forEach((b, i) => { b.rotation.z = Math.sin(t * 1.5 + i) * 0.05; });
    },
    dispose() { host.removeEventListener('pointerdown', tap); }
  });
  setTimeout(fit, 0);
};

/* ---------- Inselkarte ---------- */
A.map = (sec, data, cb) => {
  T = K.T; A.leave();
  sec.classList.add('g3d');
  let host = sec.querySelector('.map3d');
  if (!host) { host = document.createElement('div'); host.className = 'map3d'; host.innerHTML = '<div class="labs"></div><div class="hint3d">← wischen →</div>'; sec.appendChild(host); }
  const labs = host.querySelector('.labs'); labs.innerHTML = '';
  const scene = new T.Scene(); scene.background = K.sky('#6ec8ff', '#d9f2ff'); scene.fog = new T.Fog(0xd9f2ff, 16, 34);
  const L = K.lights(scene, { size: 7, sx: 4, sz: 6 });
  const cam = new T.PerspectiveCamera(38, 1, 0.1, 80);
  const water = K.water(80, 50, 0x3fbfef, { seg: 40 }); scene.add(water);
  const pos = n => new T.Vector3((n - 1) * 4.4, 0, Math.sin(n * 1.25) * 1.5);
  const pickables = [], items = [];
  data.list.forEach(d => {
    const g = island(d.n, { grey: !d.open, r: 1.55 }); g.position.copy(pos(d.n)); scene.add(g); g.userData.d = d; pickables.push(g);
    const lab = document.createElement('button'); lab.className = 'lab3d' + (d.cur ? ' cur' : '') + (d.open ? '' : ' lock');
    lab.dataset.act = d.open ? 'isl' : 'locked'; lab.dataset.n = d.n; lab.innerHTML = d.html; labs.appendChild(lab);
    items.push({ g, lab, d });
    if (d.done) { const f = K.model('pf-flag', { s: 0.9 }); f.position.set(1.0, g.top, 0.5); g.add(f); }
  });
  // Weg aus Trittsteinen zwischen den Inseln

    const a = pos(n), b = pos(n + 1);
    for (let k = 1; k <= 5; k++) { const p = a.clone().lerp(b, 0.25 + k * 0.5 / 6); const s = new T.Mesh(stoneG, stoneM); s.position.set(p.x, 0.02, p.z + 0.5); s.receiveShadow = true; scene.add(s); }
  }

    const n = data.list.length + 1, g = island(n, { grey: true, theme: 'soon', r: 1.3 }); g.position.copy(pos(n)); scene.add(g); pickables.push(g); g.userData.soon = true;
    const lab = document.createElement('button'); lab.className = 'lab3d soon'; lab.dataset.act = 'soon'; lab.innerHTML = data.soon; labs.appendChild(lab); items.push({ g, lab, d: { soon: 1 } });
    for (let k = 0; k < 3; k++) { const fogI = island(n + 1 + k, { grey: true, theme: 'soon', r: 1.0 }); fogI.position.copy(pos(n + 1 + k)); fogI.position.z -= 1.5; scene.add(fogI); }
  }
  // Figur steht auf der aktuellen Insel
  const cur = data.list.find(d => d.cur) || data.list[0];
  const fig = K.char(data.char, data.wear); fig.scale.setScalar(0.85); scene.add(fig);
  const curI = items.find(i => i.d === cur); fig.position.copy(curI.g.position).add(new T.Vector3(0.1, curI.g.top, 0.75)); fig.rotation.y = -1.1; fig.look = -0.3;
  const arrow = K.textSprite('▼', { color: '#ffcf2e', stroke: '#5a4668', size: 64, h: 0.42 }); scene.add(arrow);
  const boat = K.model('pi-ship-small', { s: 0.16 }); scene.add(boat); boat.position.set(pos(3).x + 0.6, 0, pos(3).z + 3.2); boat.rotation.y = 1.2;
  const cl = clouds(scene, 10, 40, 4.5);
  const minX = pos(1).x, maxX = pos(data.list.length + (data.soon ? 1 : 0)).x;
  let tx = curI.g.position.x, vx = 0, drag = null, moved = 0;
  const camAt = () => { const z = Math.sin((tx / 4.4 + 1) * 1.25) * 1.5 * 0.6; cam.position.set(tx, 7.2, z + 8.6); cam.lookAt(tx, 0, z - 0.3); L.sun.position.set(tx + 4, 9, z + 6); L.sun.target.position.set(tx, 0, z); water.position.x = tx; };
  const down = e => { drag = { x: e.clientX, tx, t: performance.now() }; moved = 0; vx = 0; host.setPointerCapture && host.setPointerCapture(e.pointerId); };
  const move = e => { if (!drag) return; const dx = e.clientX - drag.x; moved = Math.max(moved, Math.abs(dx)); const k = 9 / Math.max(300, host.clientWidth); const nx = drag.tx - dx * k; vx = (nx - tx) / Math.max(0.016, 0.016); tx = nx; host.querySelector('.hint3d').style.opacity = 0; };
  const up = e => {
    if (!drag) return; drag = null;
    if (moved < 8 && !(e.target.closest && e.target.closest('.lab3d'))) { const hit = K.pick(e, cam, pickables); if (hit) { let o = hit.object; while (o && !o.userData.d && !o.userData.soon) o = o.parent; if (o) cb(o.userData.soon ? { soon: true } : o.userData.d); } vx = 0; }
  };

  const wheel = e => { tx += (e.deltaX || e.deltaY) * 0.01; e.preventDefault(); }; host.addEventListener('wheel', wheel, { passive: false });
  camAt();
  K.live(host, {
    scene, camera: cam,
    update(dt, t) {
      if (!drag) { tx += vx * dt * 0.12; vx *= Math.pow(0.02, dt); }
      tx = Math.max(minX - 0.5, Math.min(maxX + 0.5, tx)); camAt(); water.tick(t);
      fig.pose(t, 'idle'); arrow.position.set(fig.position.x, fig.position.y + 1.55 + Math.sin(t * 3) * 0.08, fig.position.z);
      boat.position.y = Math.sin(t) * 0.05; boat.rotation.z = Math.sin(t * 0.8) * 0.04;
      cl.forEach(c => { c.position.x += c.sp * dt; if (c.position.x > tx + 22) c.position.x = tx - 22; });
      items.forEach(it => {
        const g = it.g; if (g.anim) g.anim.forEach((b, i) => { b.rotation.z = Math.sin(t * 1.4 + i) * 0.06; b.rotation.x = Math.cos(t * 1.1 + i) * 0.04; });
        if (g.glows) g.glows.forEach(s => { s.material.opacity = 0.6 + Math.sin(t * 2.5) * 0.3; });
        const p = K.toScreen(g.position.clone().add(new T.Vector3(0, 0, 1.75)), cam, host);
        const on = p.vis && p.x > -120 && p.x < host.clientWidth + 120;
        it.lab.style.display = on ? '' : 'none'; if (on) it.lab.style.transform = `translate(${p.x.toFixed(1)}px, ${p.y.toFixed(1)}px) translate(-50%, -30%)`;
      });
    },
    dispose() { host.removeEventListener('pointerdown', down); host.removeEventListener('pointermove', move); host.removeEventListener('pointerup', up); host.removeEventListener('pointercancel', up); host.removeEventListener('wheel', wheel); }
  });
};

/* ---------- Laden: Figur dreht sich ---------- */
A.shop = (el, S) => {
  T = K.T; A.leave();
  el.innerHTML = ''; el.classList.add('fig3d');
  const scene = new T.Scene(); K.lights(scene, { size: 1.5, sx: 2, sz: 4 });
  const ped = new T.Mesh(new T.CylinderGeometry(0.62, 0.7, 0.14, 24), LM(0xf3e9ff)); ped.position.y = -0.07; ped.receiveShadow = true; scene.add(ped);
  const fig = K.char(S.char, S.wear); scene.add(fig);
  const cam = new T.PerspectiveCamera(30, 1, 0.1, 20); cam.position.set(0, 1.0, 3.0); cam.lookAt(0, 0.55, 0);
  let spin = -0.6, drag = null;
  const down = e => { drag = { x: e.clientX, s: spin }; }, move = e => { if (drag) spin = drag.s + (e.clientX - drag.x) * 0.02; }, up = () => { drag = null; };
  el.addEventListener('pointerdown', down); el.addEventListener('pointermove', move); el.addEventListener('pointerup', up);
  K.live(el, { scene, camera: cam,
    update(dt, t) { if (!drag) spin += dt * 0.5; fig.rotation.y = spin; fig.pose(t, (t % 6) > 5 ? 'cheer' : 'idle'); },
    dispose() { el.removeEventListener('pointerdown', down); el.removeEventListener('pointermove', move); el.removeEventListener('pointerup', up); el.classList.remove('fig3d'); } });

/* ---------- Standbild ---------- */
A.img = (cid, wear, cls) => `<img class="${cls || 'f3d'}" alt="" draggable="false" src="${K.snap(cid, wear, 300, 330)}">`;
A.leave = () => { K.stopLive(); };
})();

<script>/* Klarinetten-Abenteuer · Oberfläche, Ton, Mikrofon, Übungen, Belohnungen, Spiel, Elternbereich. */
(function () {
'use strict';

const SIM = Q.has('sim'), AUTO = Q.has('auto'), SPEED = +(Q.get('speed') || 1);

/* ================= Spielstand ================= */
// Der Schlüssel KEY bleibt bei Updates gleich, sonst wären Sterne weg. Neue Felder ergänzt KL.migrateSave.
// Neuer leerer Stand: KL.freshSave() in logic.js (gemeinsam mit dem Spiel spiel.html)

// Version, Erstellungszeit und Mitwirkende setzt tools/build.mjs aus src/meta.json ein
const META = window.KLMETA || { version: '0.0.0', built: '', model: '', credits: [] };
// Tablet / Silk-Browser (Fire HD): Touch als Hauptbedienung oder Silk bzw. Android in der Kennung
const TABLET = /Silk|Android|iPad/i.test(navigator.userAgent) || (window.matchMedia && matchMedia('(pointer:coarse)').matches);
const autoFileOn = () => S.set.autoFile === null || S.set.autoFile === undefined ? !TABLET : !!S.set.autoFile;
// Vom Startbildschirm gestartet (Web-App-Manifest): Der Browser zeigt die App schon ohne Leisten
const APPMODE = () => !!(window.matchMedia && (matchMedia('(display-mode: fullscreen)').matches || matchMedia('(display-mode: standalone)').matches));
// Testseite (https/localhost mit Manifest): Service Worker macht sie offline nutzbar. Als Datei geöffnet: nichts davon.

// Vollbild braucht ein Tippen, darum beim ersten Tippen (und nach dem Verlassen beim nächsten)
function fullOn() {
  const m = S.set.full || 'auto'; if (m === 'off' || (m === 'auto' && !TABLET) || Q.get('demo') || SIM) return;
  const d = document, el = d.documentElement;

}
function load() {
  let raw = null; try { raw = localStorage.getItem(KEY); } catch (e) {}
  if (!raw) return fresh();
  try {
    const old = JSON.parse(raw), m = KL.migrateSave(old, fresh());
    if (m) { if (old.v !== KL.SAVE_VERSION) try { localStorage.setItem(KEY + '_vor_update_v' + old.v, raw); } catch (e) {} return m; }
  } catch (e) {}
  try { localStorage.setItem(KEY + '_unlesbar_' + Date.now(), raw); } catch (e) {} // nie stillschweigend wegwerfen
  return fresh();
}
let S = load();
// Speichern: jede Änderung sofort; dazu eine Tagessicherung (die letzten 7 Tage bleiben), höchstens einmal pro Minute
const SNAP = KEY + '_tag_'; let snapT = 0, lastJ = JSON.stringify(S);
let save = () => {
  try {
    const j = JSON.stringify(S); localStorage.setItem(KEY, j); lastJ = j;
    if (Date.now() - snapT > 60000 && S.stars + Object.keys(S.st).length > 0) {
      snapT = Date.now(); localStorage.setItem(SNAP + today(), j);
      snapList().slice(7).forEach(k => localStorage.removeItem(SNAP + k));
    }
  } catch (e) {}
};
// Tage mit Tagessicherung, neueste zuerst
function snapList() { const out = []; try { for (let i = 0; i < localStorage.length; i++) { const k = localStorage.key(i); if (k && k.indexOf(SNAP) === 0) out.push(k.slice(SNAP.length)); } } catch (e) {} return out.sort().reverse(); }
// Beim Schließen, Wegwischen oder Wechsel in eine andere App sofort speichern
// nur wenn sich etwas geändert hat, damit ein alter Tab keinen neueren Stand überschreibt
const saveIfChanged = () => { if (JSON.stringify(S) !== lastJ) save(); };
document.addEventListener('visibilitychange', () => { if (document.visibilityState === 'hidden') saveIfChanged(); });
window.addEventListener('pagehide', saveIfChanged);
try { if (navigator.storage && navigator.storage.persist) navigator.storage.persist(); } catch (e) {} // Browser soll den Speicher nicht von selbst leeren
const esc = t => String(t).replace(/[&<>"']/g, c => ({ '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;', "'": '&#39;' })[c]);
const cm = () => S.name ? ', ' + esc(S.name) : ''; // ", Lina" oder nichts
const day = () => KL.dayRec(S, today());
const stat = id => S.st[id] || (S.st[id] = { best: 0, n: 0, last: '', rep: 0, medal: 0 });
const best = id => (S.st[id] ? S.st[id].best : 0);
const isl = n => KL.ISLANDS[n - 1];
const PLAYABLE = KL.ISLANDS.filter(i => i.st.length).length;

/* ================= Ton-Ausgabe: klarinettenartiger Klang aus Web Audio ================= */
let AC = null, WAVE = null, MUTE_UNTIL = 0;
function ac() {
  if (!AC) {
    AC = new (window.AudioContext || window.webkitAudioContext)();
    const amp = [0, 1, 0, 0.75, 0, 0.5, 0, 0.14, 0, 0.5, 0, 0.12, 0, 0.17], re = new Float32Array(amp.length), im = new Float32Array(amp);
    WAVE = AC.createPeriodicWave(re, im);
  }
  if (AC.state === 'suspended') AC.resume();
  return AC;
}
function blip(f, t0, d, type, vol) {
  if (S.set.mute) return;
  try {
    const a = ac(), o = a.createOscillator(), g = a.createGain(), t = a.currentTime + t0;
    o.type = type || 'sine'; o.frequency.value = f; g.gain.setValueAtTime(0.0001, t); g.gain.linearRampToValueAtTime(vol || 0.15, t + 0.015); g.gain.exponentialRampToValueAtTime(0.0001, t + d);
    o.connect(g); g.connect(a.destination); o.start(t); o.stop(t + d + 0.03);
  } catch (e) {}
}
const PLAYING = { osc: [], tm: [], end: 0 }; let SHOWNOTES = false; // SHOWNOTES: beim Anhören Note und Griff zeigen // laufendes Vorspielen, damit es gestoppt werden kann
function stopPlay() {
  PLAYING.osc.forEach(o => { try { o.stop(); } catch (e) {} }); PLAYING.tm.forEach(clearTimeout);
  PLAYING.osc = []; PLAYING.tm = []; PLAYING.end = 0; demoShow(); MUTE_UNTIL = Math.min(MUTE_UNTIL, now() + 0.15); demoBtn();
}
const isPlaying = () => now() < PLAYING.end;
// Zeigt im Startfenster, welcher Ton gerade vorgespielt wird: Name, Note, Griffbild
function demoShow(name) {
  const v = $('demoV'); if (!v) return;
  if (name === undefined) { v.innerHTML = ''; v.classList.remove('on'); $('exGo').classList.remove('demo'); return; }
  v.classList.add('on'); $('exGo').classList.add('demo');
  v.innerHTML = name ? `<div class="dn"><div class="bigname">${name}</div><div class="staff">${single(name)}</div></div><div class="df">${fingSVG(name)}</div>` : '<div class="dn"><div class="bigname">Pause</div></div>';
}
function demoBtn() { const b = document.querySelector('[data-act="demo"]'); if (b) b.textContent = isPlaying() ? '⏹ Stopp' : '▶ Anhören'; }
function clarTone(f, t0, d) { // f klingend, Zeiten in echten Sekunden
  try {
    const a = ac(), o = a.createOscillator(), fl = a.createBiquadFilter(), g = a.createGain(), t = a.currentTime + t0;
    o.setPeriodicWave(WAVE); o.frequency.value = f; fl.type = 'lowpass'; fl.frequency.value = 2600; fl.Q.value = 0.7;

    g.gain.setValueAtTime(0.0001, t); g.gain.linearRampToValueAtTime(v, t + 0.05); g.gain.setValueAtTime(v * 0.85, t + Math.max(0.06, d - 0.08)); g.gain.linearRampToValueAtTime(0.0001, t + d);

}
const sOk = () => { blip(660, 0, 0.12); blip(880, 0.1, 0.18); };
const sBad = () => blip(220, 0, 0.25, 'triangle', 0.1);
const sStar = () => [523, 659, 784, 1047].forEach((f, i) => blip(f, i * 0.1, 0.22));
const click = (t0, acc) => blip(acc ? 1500 : 1100, t0, 0.03, 'square', acc ? 0.06 : 0.035);
// Spielt Töne vor; das Mikrofon hört solange weg. items: [{name|null, beats}] , bpm. Rückgabe: Dauer in Spielzeit-Sekunden
function playSeq(items, bpm, onNote) {
  stopPlay(); // nie zwei Vorspiele übereinander
  const spb = 60 / bpm, show = SHOWNOTES; let t = 0; SHOWNOTES = false;
  items.forEach((it, i) => {
    const d = it.beats * spb;
    if (it.name) clarTone(KL.concertFreq(it.name, S.set.a4), t / SPEED, Math.max(0.12, d * 0.92) / SPEED);
    if (onNote) PLAYING.tm.push(setTimeout(() => onNote(i), t * 1000 / SPEED));

  });

  PLAYING.tm.push(setTimeout(() => { PLAYING.end = 0; demoBtn(); demoShow(); }, t * 1000 / SPEED + 50)); demoBtn();

/* ================= Mikrofon und Tonerkennung ================= */
const MIC = { ok: false, err: '', an: null, buf: null, floor: 0.003, f3: [] };
let LOOP = null, LAST = 0, LISTEN = null, LASTSAVE = 0; // LISTEN(frame) bekommt jede Messung
async function micOn() {
  if (MIC.ok) return true;
  if (SIM) { MIC.ok = true; loop(); return true; }
  try {
    if (!navigator.mediaDevices || !navigator.mediaDevices.getUserMedia) throw { name: 'NoSecureContext' };
    const stream = await navigator.mediaDevices.getUserMedia({ audio: { echoCancellation: false, noiseSuppression: false, autoGainControl: false } });
    const a = ac(), src = a.createMediaStreamSource(stream), an = a.createAnalyser(); an.fftSize = 2048; src.connect(an);
    MIC.an = an; MIC.buf = new Float32Array(2048); MIC.ok = true; loop(); return true;
  } catch (e) { MIC.err = e && e.name ? e.name : String(e); return false; }
}
function loop() { if (!LOOP) { LAST = now(); LOOP = setInterval(tick, 30); } }
function measure() {
  if (SIM) {
    let w = window.KLSIM || { f: 0, rms: 0 };
    if (AUTO && EX && EX.want) w = EX.want(now()) || { f: 0, rms: 0 };
    if (window.KLWRONG && w.f) w = { f: w.f * 1.1225, rms: w.rms }; // Gegenprobe im Test: immer einen Ganzton zu hoch
    return { rms: w.rms || 0, pitch: w.f ? { f: w.f, clarity: 0.97 } : null };
  }
  MIC.an.getFloatTimeDomainData(MIC.buf);
  const r = KL.rms(MIC.buf);
  return { rms: r, pitch: r > 0.004 ? KL.yin(MIC.buf, AC.sampleRate, 150, 900) : null };
}
function tick() {
  const t = now(), dt = Math.min(0.2, t - LAST); LAST = t;
  const fr = KL.pitchFrame(MIC, measure(), t, dt, MUTE_UNTIL, S.set.a4); // MIC hält Grundrauschen und Median (floor, f3)
  if (fr.voiced && EX && EX.running) {
    const r = KL.practiceTick(S, dt / SPEED, today());
    if (r.goal) { save(); confetti(); toast('🎉 Tagesziel geschafft' + (S.name ? ', ' + S.name : '') + '! ' + S.set.goal + ' Minuten Klarinette – super!', 4000); hud(); }
    if (r.fleiss) { save(); toast('💪 Fleiß-Stern für 5 Minuten Spielen' + (S.name ? ', ' + S.name : '') + '!'); hud(); }
    if (t - LASTSAVE > 10) { LASTSAVE = t; save(); }
  }

}

// Teile wie Heft S. 4: leicht auseinandergezogen, schwarz mit Silberringen, je drei Ringklappen auf Ober- und Unterstück
const PARTS = [{ n: 'Mundstück', x: 8, w: 70 }, { n: 'Blattschraube', x: 40, w: 24 }, { n: 'Birne', x: 92, w: 50 }, { n: 'Oberstück', x: 156, w: 206 }, { n: 'Unterstück', x: 376, w: 206 }, { n: 'Schallbecher', x: 596, w: 150 }];
function clarSVG(hi) {
  const BK = '#2b2333', SV = '#c9c9d2', ring = x => `<rect x="${x}" y="50" width="5" height="30" rx="1.5" fill="${SV}" stroke="#8a8a96" stroke-width="1"/>`;
  const hole = x => `<circle cx="${x}" cy="65" r="8" fill="#14101a" stroke="${SV}" stroke-width="3.5"/>`;

  s += `<path d="M8 61 L78 55 L78 75 L8 67 Z" fill="${BK}"/><path d="M12 68 L78 75 L78 80 L18 73 Z" fill="#e3c48a" stroke="#b9975a" stroke-width="1"/>`; // Mundstück mit Blatt
  s += `<rect x="40" y="51" width="24" height="31" rx="4" fill="${SV}" stroke="#8a8a96" stroke-width="2"/><path d="M46 51 v31 M58 51 v31" stroke="#8a8a96" stroke-width="1.5"/>`; // Blattschraube
  s += `<path d="M92 54 Q117 47 142 54 L142 76 Q117 83 92 76 Z" fill="${BK}"/>${ring(92)}${ring(137)}`; // Birne
  s += `<rect x="156" y="54" width="206" height="22" fill="${BK}"/>${ring(156)}${ring(357)}<path d="M178 58 H346" stroke="${SV}" stroke-width="2"/>${[226, 266, 306].map(hole).join('')}<ellipse cx="196" cy="70" rx="6" ry="3.5" fill="${SV}"/><ellipse cx="338" cy="70" rx="6" ry="3.5" fill="${SV}"/>`; // Oberstück
  s += `<rect x="376" y="54" width="206" height="22" fill="${BK}"/>${ring(376)}${ring(577)}<path d="M396 58 H566" stroke="${SV}" stroke-width="2"/>${[440, 480, 520].map(hole).join('')}<ellipse cx="552" cy="70" rx="7" ry="3.5" fill="${SV}"/><ellipse cx="410" cy="70" rx="6" ry="3.5" fill="${SV}"/>`; // Unterstück
  s += `<path d="M596 54 L670 54 Q722 52 744 26 L744 104 Q722 78 670 76 L596 76 Z" fill="${BK}"/>${ring(596)}<path d="M740 28 V102" stroke="${SV}" stroke-width="4"/>`; // Schallbecher
  if (hi != null) { const p = PARTS[hi], bell = p.n === 'Schallbecher'; s += `<rect x="${p.x - 5}" y="${bell ? 18 : 42}" width="${p.w + 10}" height="${bell ? 94 : 46}" rx="10" fill="none" stroke="#ff4f8b" stroke-width="6"/><path d="M${p.x + p.w / 2} 4 v${bell ? 10 : 30} m-10 -10 l10 10 l10 -10" stroke="#ff4f8b" stroke-width="6" fill="none" stroke-linecap="round"/>`; }
  return s + '</svg>';
}

/* ================= Anzeige ================= */
let screen = 'home';
function streak() {
  const goal = S.set.goal * 60; let n = 0, joker = 0;
  for (let off = 0; off < 120; off++) {
    const d = S.days[dayKey(off)], hit = d && d.sec >= goal;
    if (hit) n++;
    else if (off === 0) continue;
    else if (joker < 1 && n > 0) { joker++; }
    else break;
    if (off % 7 === 6) joker = 0;
  }
  return n;
}
function hud() {
  const d = day(), m = Math.floor(d.sec / 60);
  $('hStar').textContent = '⭐ ' + S.stars; $('hTix').textContent = '🎟️ ' + S.tix; $('hFire').textContent = '🔥 ' + streak();
  $('tday').innerHTML = `<i style="width:${Math.min(100, d.sec / (S.set.goal * 60) * 100)}%"></i><span>⏱ ${m}/${S.set.goal} min</span>`;

  $('bOpt').style.visibility = screen === 'who' && !S.char ? 'hidden' : 'visible';

const INFO = {

};
function show(id) { stopEx(); stopRun(); TUNER = false; screen = id; if (window.K3DAPP) window.K3DAPP.leave(); document.querySelectorAll('.scr').forEach(e => e.classList.toggle('on', e.id === id)); hud(); }
let toastT = 0;
function toast(t, ms) { const e = $('toast'); e.textContent = t; e.style.display = 'block'; clearTimeout(toastT); toastT = setTimeout(() => { e.style.display = 'none'; }, ms || 2600); }

const MEDAL = ['', '🥉', '🥈', '🥇'];
const ICON = { quiz: '❓', breath: '🌬️', blow: CLAR_ICON, learn: '🎓', long: '〰️', tongue: '👅', seq: '🎵', ear: '👂', song: '🎶' };
const KIND = { quiz: 'Quiz', breath: 'Atmen', blow: 'Erster Ton', learn: 'Neuer Ton', long: 'Lange Töne', tongue: 'Anstoßen', seq: 'Tonfolge', ear: 'Hör-Spiel', song: 'Lied' };

/* ================= Tagesmissionen ================= */
// 3 Aufgaben pro Tag (Auswahl in KL.dayMissions). Jede gibt +1 Stern, alle drei die Schatztruhe (+3 Sterne, +1 Ticket).
function missions() { return KL.missionsFor(S, today(), PLAYABLE); }
const misLabel = m => KL.misLabel(m);

function misStation(m) {

  for (let n = Math.min(S.unlocked, PLAYABLE); n >= 1; n--) { const st = isl(n).st.find(s => (s.type === 'long' && s.notes.indexOf(m.note) >= 0) || (s.type === 'learn' && s.note === m.note)); if (st) return st.id; }

}

}

/* ================= Start, Karte, Insel ================= */
function nextStation() {
  const hw = S.hw && S.hw.ids ? S.hw.ids : [];

      demo() { playSeq(notes, bpm, i => { document.querySelectorAll('#exL .n').forEach(e => e.classList.remove('now')); pageTo(notes[i].bar); mark(i, 'now'); }); },
      pre() { $('exL').innerHTML = `<div class="staff">${staffSVG(notes)}</div>`; pageTo(0); $('exFing').innerHTML = fingSVG(notes.find(n => !n.rest).name); },
      begin() {

      want(t) { const rel = t - t0; let j = 0; while (j < notes.length - 1 && rel > starts[j] + notes[j].beats * spb) j++; const n = notes[j]; if (rel < 0 || !n || n.rest) return { f: 0, rms: 0 }; const into = rel - starts[j]; return into > n.beats * spb - 0.05 ? { f: 0, rms: 0 } : autoWant(n.name, t); }

  /* ----- Ohren-Spiel: hören und nachspielen ohne Noten ----- */
  ear(st, D) {

  /* ----- Atmung (Lektion 1): einatmen und kräftig pusten ----- */
  breath(st) {

    return {
      say: 'Bauch-Atmung 🌬️<br>Leg eine Hand auf den Bauch. Wenn der Kreis wächst: <b>einatmen</b> (4 Schläge). Wenn er schrumpft: <b>„FFF“ pusten</b> – kräftig, so dass ' + CN() + ' es hört.',

  // Sterne, Bonus, Abwechslung, Missionen, Ticket: KL.award in logic.js (gleiche Regeln im Spiel)
  const r = KL.award(S, { id: e.id, isl: e.isl, earned, date: today(), playable: PLAYABLE, medal: e.st.medal || 0 });
  const pay = r.pay, tix = r.tix, current = r.current, extra = r.extra, medal = r.medal ? MEDAL[r.medal] : '';
  let unlock = '';
  const I = isl(e.isl);
  // Nächste Insel: alle 👑-Hauptaufgaben dieser Insel mit mindestens 1 Stern (Bonusaufgaben dürfen offen bleiben)
  if (e.isl === S.unlocked && e.isl < PLAYABLE && KL.islandPassed(I, best)) { S.unlocked++; unlock = `<p class="say">🗺️ Neue Insel offen: ${isl(S.unlocked).icon} ${isl(S.unlocked).name}!${I.st.some(x => best(x.id) < 1) ? '<br><span class="muted">Die übrigen Aufgaben auf ' + I.name + ' kannst du später nachholen.</span>' : ''}</p>`; }
  save(); hud();
  const c = cm(), msg = earned === 3 ? pick([`Wow${c}, perfekt gespielt!`, `Spitze${c}! Das klingt richtig gut!`, `Super${c} – du bist ein Klarinetten-Profi!`]) : earned === 2 ? pick([`Gut gemacht${c}! Noch ein bisschen üben, dann wird es perfekt.`, `Klasse${c}! Fast alles richtig.`]) : earned === 1 ? `Ein guter Anfang${c}! Probier es gleich nochmal.` : `Das war schwer${c}. Hör es dir nochmal an und versuch es noch einmal – du schaffst das!`;
  const nxt = KL.station(nextAfter(e.id)); e.nextId = nxt ? nxt.st.id : null;
  const tip = e.st.type === 'tongue' ? 'Tipp: Kinn ruhig, nur die Zunge bewegt sich.' : e.st.type === 'long' && earned < 3 ? 'Tipp: Vorher tief in den Bauch einatmen.' : e.st.type === 'song' && earned < 3 ? 'Tipp: Mit 🐢 langsam üben.' : '';
  $('exRes').innerHTML = `<div class="stars">${starStr(earned)}</div><div class="say" style="max-width:720px">${msg}${tip ? '<br><span class="muted">' + tip + '</span>' : ''}</div><p style="font-size:24px;font-weight:800;margin:6px 0">${pay ? '+' + pay + ' ⭐' : current ? 'Kein neuer Stern – versuch deinen Rekord zu knacken!' : 'Gut geübt! Neue Sterne gibt es auf den neuen Inseln.'} ${tix ? ' · +' + tix + ' 🎟️' : ''} ${medal ? ' · Medaille ' + medal : ''}</p>${extra.length ? '<p class="xtra">' + extra.join('<br>') + '</p>' : ''}${unlock}<div class="row"><button class="btn alt" data-act="back">🗺️ Zur Insel</button><button class="btn alt huge" data-act="again">🔁 Nochmal</button>${nxt ? `<button class="btn green huge nx" data-act="nextst">➡ Weiter<small>${nxt.isl.n !== e.isl ? nxt.isl.icon + ' ' : ''}${nxt.st.title}</small></button>` : ''}</div>`;
  $('exRes').classList.add('on');

}

function runGo(L) {

  G = { on: true, L, w, len: 30 + L * 1.5, dist: 0, sp: (230 + L * 16) * slow, gapT: Math.max(0.62, 1.3 - L * 0.034), fly: L < 2 ? 0 : 0.12 + L * 0.016, dbl: L >= 8 ? 0.15 + (L - 8) * 0.02 : 0,
    car: 0, carN: 0, hp: 3 + extra, y: 0, vy: 0, objs: [], nxt: 1.2, inv: 0, last: 0, jumps: 0,

// Pause: Spiel anhalten, Weiter oder Aufhören

}
function runResume() { if (!G) return; $('runM').style.display = 'none'; G.on = true; G.last = 0; requestAnimationFrame(runTick); }
function runJump() { if (!G || !G.on) return; if (G.y === 0) { G.vy = G.jumpV; G.jumps = 1; blip(520, 0, 0.08); } else if (G.wings && G.jumps === 1) { G.vy = G.jumpV * 0.85; G.jumps = 2; blip(700, 0, 0.08); } }
function spawn(Fw, emoji, y, car, h) { const el = document.createElement('span'); el.className = 'ob'; el.textContent = emoji; el.style.bottom = (56 + y) + 'px'; $('runF').appendChild(el); G.objs.push({ el, x: Fw + 20, y, car, w: 36, h: h || 40 }); }
function runTick(ts) {
  if (!G || !G.on) return; const dt = Math.min(0.05, (ts - (G.last || ts)) / 1000); G.last = ts;
  const Fw = $('runF').clientWidth, a = $('runA');
  G.dist += dt; G.inv -= dt; G.vy -= 1900 * dt; G.y += G.vy * dt; if (G.y <= 0) { G.y = 0; G.vy = 0; G.jumps = 0; }
  a.style.transform = `translate(0,${-G.y}px)`; a.classList.toggle('inv', G.inv > 0);
  G.nxt -= dt;
  if (G.dist < G.len && G.nxt <= 0) {
    const r = Math.random();
    if (r < 0.38) { G.carN++; spawn(Fw, '🥕', pick([6, 70, 110]), true, 34); }
    else if (r < 0.38 + G.fly) spawn(Fw, G.w.fly, pick([70, 95]), false, 34);
    else { spawn(Fw, pick(G.w.ob), 0, false, 42); if (Math.random() < G.dbl) setTimeout(() => { if (G && G.on) spawn(Fw, pick(G.w.ob), 0, false, 42); }, 150); }
    G.nxt = G.gapT + Math.random() * 0.7;
  }
  if (G.dist >= G.len && !G.flag) { const el = document.createElement('span'); el.className = 'ob'; el.textContent = '🏁'; el.style.bottom = '56px'; el.style.fontSize = '64px'; $('runF').appendChild(el); G.flag = { el, x: Fw + 40 }; }
  if (G.flag) { G.flag.x -= G.sp * dt; G.flag.el.style.transform = `translate(${G.flag.x}px,0)`; if (G.flag.x < 120) return runEnd(true); }
  for (let i = G.objs.length - 1; i >= 0; i--) {
    const b = G.objs[i]; if (b.car && G.magnet && b.x < 360 && b.x > 60) b.y += ((G.y + 40) - b.y) * Math.min(1, dt * 6), b.el.style.bottom = (56 + b.y) + 'px';
    b.x -= G.sp * dt; b.el.style.transform = `translate(${b.x}px,0)`;
    const hit = b.x < 50 + 82 && b.x + b.w > 50 + 22 && b.y < G.y + 92 && b.y + b.h > G.y + 8; let gone = b.x < -60;
    if (hit && b.car) { G.car++; blip(880, 0, 0.08); gone = true; }
    else if (hit && G.inv <= 0) { if (G.shield > 0) { G.shield--; toast('⛑️ Der Helm hat dich beschützt!'); } else { G.hp--; sBad(); } G.inv = 1.2; }

  }

}
function runEnd(won) {
  const L = G.L, frac = G.carN ? G.car / G.carN : 1, st = won ? (frac >= 0.8 ? 3 : frac >= 0.5 ? 2 : 1) : 0; G.on = false; G = null;

  save(); runMenu(won ? `Level ${L + 1} geschafft! ${'⭐'.repeat(st)} ${L % 5 === 4 ? '🏆 Welt geschafft!' : ''}` : 'Oh nein, keine Leben mehr. Versuch es nochmal!');
}

   <tr><td>Tonprüfung</td><td>${sel('sTol', [[10, 'großzügig'], [0, 'normal'], [-10, 'streng']], S.set.tolAdj)}</td></tr>
   <tr><td>Stimmton a'</td><td>${sel('sA4', [438, 439, 440, 441, 442, 443].map(v => [v, v + ' Hz']), S.set.a4)}</td></tr>
   <tr><td>Sicherungsdatei jede Woche</td><td>${sel('sFile', [['auto', 'automatisch (PC an, Tablet aus)'], [1, 'an (Ordner Downloads)'], [0, 'aus']], S.set.autoFile === true ? 1 : S.set.autoFile === false ? 0 : 'auto')}</td></tr>
   <tr><td>Vollbild</td><td>${sel('sFull', [['auto', 'automatisch auf Tablets'], ['on', 'immer'], ['off', 'aus']], S.set.full || 'auto')}</td></tr>
   <tr><td>Klang-Formeln: Hilfe</td><td>${sel('sHelp', [['auto', 'automatisch nach Können'], [1, 'immer mit Notennamen und Griff'], [2, 'nur Noten (Notenlesen)'], [3, 'nur hören (Gehör)']], S.set.help || 'auto')}</td></tr>
   ${WEB ? `<tr><td>Grafik</td><td>${sel('sGfx', [['auto', '3D (Inseln, Figuren, Spiel)'], ['2d', 'einfach (2D, für schwache Geräte)']], S.set.gfx === '2d' ? '2d' : 'auto')}</td></tr>` : ''}</table>
   <button class="btn green" data-act="setsave">Speichern</button><button class="btn alt" data-act="reset">Spielstand löschen</button></div>
  <div class="card"><h2>So bewertet die App gerade</h2><p>Insel ${Math.min(S.unlocked, PLAYABLE)}: Ton gilt als richtig bis <b>±${D.tol} Cent</b>, in Tonfolgen <b>${D.hold} s</b> halten, lange Töne <b>${D.longSec} s</b>. Sterne ab ${D.th.map(x => Math.round(x * 100) + ' %').join(' / ')} Treffern.</p><p class="muted">Mit jeder Insel wird es in kleinen Schritten genauer (siehe Konzept). Wiederholte Übungen geben nur neue Bestwert-Sterne. Bei 3 Sternen gibt es höchstens zweimal am Tag einen Bonus-Stern, aber nur auf der aktuellen und der vorigen Insel sowie für Hausaufgaben – so lohnt es sich nicht, immer nur die leichteste alte Übung zu spielen. Dafür: 3 Tagesmissionen (je +1 ⭐, alle zusammen Schatztruhe +3 ⭐ +1 🎟️), ein Abwechslungs-Stern für 3 verschiedene Übungen am Tag und alle 5 Minuten echte Spielzeit ein Fleiß-Stern.</p><p class="muted">Klang-Abenteuer (Ton-Hüpfer, Zauberbuch): zählt als Üben – echte Spielzeit, Sterne nach denselben Regeln, kein Ticket. Klang-Formeln haben drei Hilfe-Stufen (mit Namen, nur Noten, nur hören); automatisch kommt die nächste nach zwei Erfolgen.</p><p class="muted">Datenschutz: Der Ton wird nur in diesem Gerät ausgewertet und nie gespeichert oder gesendet.</p></div>
  <div class="card" id="techC"><h2>Technik und offline</h2>${techHTML()}</div>
  </div><div class="row"><button class="btn alt" data-act="opt">⚙️ Zurück zu den Optionen</button></div>`;
}
// Elternbereich: Fortschritt im Klang-Abenteuer (spiel.html)
function gameProg() {
  const sp = S.game && S.game.spells ? S.game.spells : {}, n = Object.keys(sp).length, g = Object.keys(sp).filter(k => sp[k].gold).length;
  const th = Object.keys(S.st).filter(id => /^TH-/.test(id) && S.st[id].best > 0).length;
  return n || th ? `<p>✨ Klang-Abenteuer: ${n} Klang-Formel${n === 1 ? '' : 'n'} gelernt${g ? ', ' + g + ' mit Gold-Siegel (nur nach Gehör)' : ''} · Ton-Hüpfer: ${th} Strecke${th === 1 ? '' : 'n'} geschafft.</p>` : '';
}
// Elternbereich: Offline-Zustand, Start vom Startbildschirm, Leistungstest
function techHTML() {
  const st = { ok: '✅ Offline bereit' + (PWA.sw ? ' (gespeichert: v' + PWA.sw + ')' : '') + '. Die App startet auch ohne WLAN.', wait: '⏳ Wird für offline gespeichert …', err: '⚠️ Offline-Speicher ging nicht. Die App läuft trotzdem, braucht aber Internet zum Start.', none: '⚠️ Dieser Browser kann die App nicht offline speichern.', file: '📄 Als Datei geöffnet: läuft ohne Internet, Spielstand nur in diesem Browser.' }[PWA.state];
  return `<p>Version v${META.version}${META.built ? ' · ' + META.built : ''}<br>${st}</p>
  <p>${APPMODE() ? '✅ Gestartet vom Startbildschirm (Vollbild ohne Browserleiste).'
    : PWA.ask ? '<button class="btn green" data-act="install">📲 Auf den Startbildschirm legen</button><br><span class="muted">Danach startet die App mit eigenem Symbol im Vollbild und ohne WLAN. Der Spielstand bleibt derselbe.</span>'
    : PWA.installed ? '✅ Auf den Startbildschirm gelegt. Bitte ab jetzt über das Symbol starten.'
    : !WEB ? 'Startbildschirm geht nur über die Internet-Adresse der App, nicht als Datei.'
    : '<b>Startbildschirm:</b> Dieser Browser bietet der App gerade keine Installation an (Knopf erscheint, sobald er es tut). Möglich: im Browser-Menü „Zum Startbildschirm hinzufügen“ bzw. „Verknüpfung erstellen“. In einem Kinderprofil ist das oft gesperrt; dann im Erwachsenen-Profil versuchen.'}</p>
  ${WEB ? `<p><b>Grafik:</b> ${G3D() ? '✅ 3D läuft' + (window.K3D.low ? ' (Auflösung automatisch gesenkt, damit es flüssig bleibt)' : '') : window.K3D && window.K3D.failed ? '2D (' + esc(window.K3D.err) + ')' : '⏳ 3D wird geladen …'}. Umschalten unter „Einstellungen“ → Grafik.<br><a href="alt/" class="muted">Ältere Version v0.3.0 (Notlösung, gleicher Spielstand)</a></p><p><b>🎵 Eltern-Klarinette:</b> Prüfen ohne Kind und ohne Klarinette. Auf dem <b>Handy</b> öffnen: <b>${esc(location.host + location.pathname.replace(/[^/]*$/, ''))}klang.html</b>. Das Handy spielt Töne, das Tablet hört zu. <a href="klang.html" class="muted">Hier öffnen</a></p>` : ''}
  ${WEB ? '<p><a class="btn alt" href="leistung.html" style="text-decoration:none;display:inline-block">📊 Leistungstest (2D/3D)</a></p><p class="muted">Misst, wie flüssig das Gerät Spiele und 3D zeigt (etwa 2 Minuten). Hilft bei der Planung des neuen Hüpfspiels. Der Spielstand wird nicht verändert.</p>' : ''}`;
}
function hwList(n) { const ids = S.hw && S.hw.ids ? S.hw.ids : []; return isl(n).st.map(s => `<label style="display:block;font-size:18px"><input type="checkbox" value="${s.id}"${ids.indexOf(s.id) >= 0 ? ' checked' : ''}> ${ICON[s.type]} ${s.title}${s.main ? ' 👑' : ''}</label>`).join(''); }

/* ================= Bedienung ================= */
document.addEventListener('click', e => {
  const b = e.target.closest ? e.target.closest('[data-act]') : null; if (!b) return;
  const a = b.dataset.act; ac(); if (a !== 'import' && a !== 'export') autoFile();
  if (a === 'home') home();
  else if (a === 'mis') { const m = missions().list[+b.dataset.i], id = m && misStation(m); if (id) openStation(id); else tuner(); }
  else if (a === 'install') install();
  else if (a === 'full') { const d = document; if (d.fullscreenElement || d.webkitFullscreenElement) (d.exitFullscreen || d.webkitExitFullscreen).call(d); else { const el = d.documentElement; try { const r = (el.requestFullscreen || el.webkitRequestFullscreen).call(el); if (r && r.catch) r.catch(() => toast('Vollbild geht in diesem Browser nicht.')); } catch (e) { toast('Vollbild geht in diesem Browser nicht.'); } } }
  else if (a === 'today') openStation(nextStation());
  else if (a === 'game') { save(); location.href = 'spiel.html'; }
  else if (a === 'hopisl') { save(); location.href = 'spiel.html?go=hop&isl=' + b.dataset.n; }
  else if (a === 'map') map();
  else if (a === 'maplist') { MAPLIST = !MAPLIST; map(); }
  else if (a === 'isl') island(+b.dataset.n);
  else if (a === 'locked') toast(b.dataset.n ? `🔒 Insel ${b.dataset.n} öffnet sich, wenn du auf Insel ${b.dataset.n - 1} alle 👑-Aufgaben mit mindestens einem Stern geschafft hast – oder wenn deine Lehrerin die Lektion als Hausaufgabe gibt.` : '🔒 Das ist noch zu. Erst die Übungen davor schaffen!', 5000);
  else if (a === 'go') openStation(b.dataset.id);
  else if (a === 'demo') { if (isPlaying()) stopPlay(); else if (EX && EX.demo) { SHOWNOTES = true; EX.demo(); SHOWNOTES = false; } }
  else if (a === 'slow') { if (EX) { const on = !EX.slowOn; openStationBpm(EX.id, on ? Math.round(EX.st.bpm * 0.8) : EX.st.bpm, on); } }
  else if (a === 'begin') begin();
  else if (a === 'skipmic') { $('exGo').classList.remove('on'); if (EX && EX.demo) EX.demo(); toast('Ohne Mikrofon gibt es keine Sterne. Bitte die Eltern, das Mikrofon einzurichten.'); }
  else if (a === 'ans') { if (EX && EX.answer) EX.answer(b.dataset.v, b); }
  else if (a === 'again') openStation(EX ? EX.id : nextStation());
  else if (a === 'nextst') openStation(EX && EX.nextId ? EX.nextId : nextStation());
  else if (a === 'back') { if (EX) island(EX.isl); else home(); }
  else if (a === 'shop') shop();
  else if (a === 'buy' || a === 'buyc') { const x = a === 'buy' ? item(b.dataset.id) : CONS.find(c => c.id === b.dataset.id); if (S.stars >= x.p) shop('', { id: x.id, kind: a === 'buy' ? 'i' : 'c' }); else shop(`Dafür brauchst du ${x.p} ⭐, du hast ${S.stars}. Übe noch ein bisschen!`); }
  else if (a === 'buyok') { const it = item(b.dataset.id); if (S.stars >= it.p && S.own.indexOf(it.id) < 0) { S.stars -= it.p; S.own.push(it.id); S.wear[it.slot] = it.id; save(); sStar(); shop(`Oh, wie schön! Danke${cm()}! ${it.ic}`); anim('sAlp', 'salto'); } else shop(); }
  else if (a === 'buycok') { const c = CONS.find(x => x.id === b.dataset.id); if (S.stars >= c.p) { S.stars -= c.p; S.cons[c.id]++; save(); sStar(); shop(c.ic + ' gekauft!'); } else shop(); }
  else if (a === 'wear') { const w = item(b.dataset.id); if (S.wear[w.slot] === w.id) delete S.wear[w.slot]; else S.wear[w.slot] = w.id; save(); shop(); }
  else if (a === 'run') runMenu();
  else if (a === 'rungo') runGo(+b.dataset.l);
  else if (a === 'runpause') runPause();
  else if (a === 'runresume') runResume();
  else if (a === 'runquit') { stopRun(); runMenu('Runde beendet. Bis zum nächsten Mal!'); }
  else if (a === 'tuner') tuner();
  else if (a === 'par') parGate();
  else if (a === 'gate') { if (+b.dataset.v === GATE) parents(); else options(); }
  else if (a === 'hwsave') { hwSync(); S.hw.txt = $('hwT').value; save(); toast('Hausaufgabe gespeichert ✓'); }
  else if (a === 'setsave') { S.set.goal = +$('sGoal').value; S.set.gameLimit = +$('sLim').value; S.unlocked = +$('sUnl').value; S.set.tolAdj = +$('sTol').value; S.set.a4 = +$('sA4').value; S.set.autoFile = $('sFile').value === 'auto' ? null : $('sFile').value === '1'; S.set.full = $('sFull').value; S.set.help = $('sHelp').value === 'auto' ? 'auto' : +$('sHelp').value; const gOld = S.set.gfx || 'auto'; if ($('sGfx')) S.set.gfx = $('sGfx').value; save(); if ((S.set.gfx || 'auto') !== gOld) { location.reload(); return; } hud(); toast('Gespeichert ✓'); parents(); }
  else if (a === 'reset') { if (window.confirm('Wirklich den ganzen Spielstand löschen? Sterne, Sachen und Übungszeiten sind dann weg.')) { S = fresh(); save(); home(); } }
  else if (a === 'opt') options();
  else if (a === 'about') { options(); setTimeout(() => { const c = $('about'); if (c && c.scrollIntoView) c.scrollIntoView(); }, 30); }
  else if (a === 'info') toast(INFO[b.dataset.k](), 4000);
  else if (a === 'soon') toast('🚧 Bald: ' + KL.ISLANDS.filter(i => !i.st.length).map(i => i.name).slice(0, 4).join(', ') + ' …', 4000);
  else if (a === 'who') who('char');
  else if (a === 'whoname') who('name');
  else if (a === 'pickchar') { S.char = b.dataset.id; save(); who('name'); }
  else if (a === 'namesave') { S.name = cleanName($('nameI').value); whoDone(); }
  else if (a === 'nameskip') { S.name = ''; whoDone(); }
  else if (a === 'export') exportSave();
  else if (a === 'import') $('impF').click();
  else if (a === 'undoimp') undoImport();
  else if (a === 'snap') restoreSnap(b.dataset.d);
  else if (a === 'snd') { S.set.mute = !S.set.mute; save(); hud(); if (!S.set.mute) sOk(); }
});
// Häkchen gelten sofort, auch über mehrere Inseln hinweg
function hwSync() {
  const n = +$('hwI').value, cur = isl(n).st.map(s => s.id), keep = (S.hw && S.hw.ids ? S.hw.ids : []).filter(id => cur.indexOf(id) < 0);
  S.hw = { isl: n, ids: keep.concat([...document.querySelectorAll('#hwL input:checked')].map(i => i.value)), txt: S.hw ? S.hw.txt || '' : '', date: today() };
  // Lehrer-Schlüssel: die Lektion der Hausaufgabe ist sofort offen (nie automatisch nach Zeit)
  if (n > S.unlocked) { S.unlocked = n; toast(`🔑 Lehrer-Schlüssel: Insel ${n} (${isl(n).name}) ist jetzt offen.`, 3500); }
  save(); const h = $('hwSum'); if (h) h.innerHTML = hwSum();
}
function hwSum() { const ids = S.hw && S.hw.ids ? S.hw.ids : []; return ids.length ? 'Markiert: ' + ids.map(id => { const r = KL.station(id); return r ? r.isl.icon + ' ' + r.st.title : ''; }).join(', ') : 'Noch keine Übung markiert.'; }
document.addEventListener('change', e => {
  if (e.target.id === 'hwI') $('hwL').innerHTML = hwList(+e.target.value);
  else if (e.target.closest && e.target.closest('#hwL')) hwSync();
  else if (e.target.id === 'impF' && e.target.files && e.target.files[0]) importSave(e.target.files[0]);
});
document.addEventListener('keydown', e => { if (e.key === 'Enter' && e.target.id === 'nameI') { e.preventDefault(); const b = document.querySelector('[data-act="namesave"]'); if (b) b.click(); } });
function openStationBpm(id, bpm, slowOn) { const r = KL.station(id); const st = Object.assign({}, r.st, { bpm }); stopEx(); exShell(r.st.title); const D = KL.diff(r.isl.n, S.set.tolAdj); EX = TYPES[st.type](st, D, r.isl.n); EX.id = id; EX.st = r.st; EX.isl = r.isl.n; EX.D = D; EX.slowOn = slowOn; intro(); }
// Vollbild auf dem Tablet: pointerup/click zählen als Tippen (pointerdown bei Touch nicht)
document.addEventListener('pointerup', fullOn, true);
$('runF').addEventListener('pointerdown', e => { if (G && G.on && !(e.target.closest && e.target.closest('[data-act]'))) { e.preventDefault(); runJump(); } });
document.addEventListener('keydown', e => { if (screen === 'run' && (e.key === ' ' || e.key === 'ArrowUp')) { e.preventDefault(); runJump(); } });

/* Testhilfen (nur mit URL-Parametern): ?sim=1&auto=1&speed=4  ·  ?demo=<StationsID>|map|shop|run|par|tun|who|name|opt  ·  &wrong=1 */
window.KLAPP = { get S() { return S; }, get EX() { return EX; }, openStation, home, finish, day, importSave, undoImport, snapList, PWA, get LASTSAVE() { return LASTSAVE; } };
const demo = Q.get('demo');
if (demo) {
  S = fresh(); save = () => {}; S.unlocked = 6; if (Q.has('wrong')) window.KLWRONG = true; // &wrong=1: simulierter Spieler immer einen Ganzton zu hoch
  S.char = Q.get('char') || 'alpaka'; S.name = Q.get('name') || '';
  if (demo === 'shop') { S.stars = 30; S.own = ['phones', 'notes', 'helmet', 'wings']; S.wear = { hat: 'phones', fx: 'notes', back: 'wings' }; shop(); }
  else if (demo === 'par') { for (let i = 0; i < 7; i++) S.days[dayKey(i)] = { sec: [900, 1200, 300, 0, 1000, 600, 950][i], ex: 4, stars: 3, fs: 2, games: 2 }; S.nt = { "c'": { n: 20, ok: 18, cs: -120, cn: 18 }, "d'": { n: 15, ok: 14, cs: 40, cn: 14 }, h: { n: 10, ok: 6, cs: -210, cn: 6 } }; ['L3-lied', 'L4-lied', 'L3-d'].forEach(id => { stat(id).best = 2; }); parents(); }
  else if (demo === 'map') map();
  else if (demo === 'run') { S.tix = 3; runMenu(); }
  else if (demo === 'tun') tuner();
  else if (demo === 'who') { S.char = ''; who('char', true); }
  else if (demo === 'name') who('name', true);
  else if (demo === 'opt') { S.stars = 12; options(); }
  else if (KL.station(demo)) { openStation(demo); if (Q.has('go')) begin(); }
  else home();
} else home();
// 3D wird nachgeladen: dann den aktuellen Bildschirm neu zeichnen (Übungen bleiben, wie sie sind)
if (window.K3D) window.K3D.ready.then(() => { if (screen === 'home') home(); else if (screen === 'map') map(); else if (screen === 'shop') shop(); else if (screen === 'who') who(WHO_STEP); else if (screen === 'opt') options(); else if (screen === 'ex') drawAlp('exAlp'); else if (screen === 'run' && !(G && G.on)) $('runA').innerHTML = alpSVG(S.wear); });
})();
</script>
</body>
